<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex">
<title>Linker</title><link rel="icon" href="https://files.catbox.moe/dkajo4.png">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https://script.google.com https://*.googleusercontent.com;">
<style>*,*::before,*::after{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:1rem;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a2a2a,#0a0a0a)}
.card{background:#fff;padding:2rem;border-radius:1.5rem;border:4px solid #facc15;box-shadow:0 25px 50px rgba(0,0,0,.5);min-width:280px;max-width:320px;text-align:center}.card.err{border-color:#e5e7eb}
.loader{border:4px solid rgba(0,0,0,.08);border-top-color:#facc15;border-radius:50%;width:42px;height:42px;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}
p{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:#111}h2{margin:0 0 8px;font-size:20px;font-weight:900;color:#dc2626;text-transform:uppercase;letter-spacing:.1em;border-bottom:2px solid #fee2e2;padding-bottom:8px}
.m{color:#4b5563;font-weight:700;font-size:12px;margin-top:12px;text-transform:none;letter-spacing:0}a{display:inline-block;margin-top:16px;background:#000;color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;padding:10px 24px;border-radius:12px;text-decoration:none}a:hover{background:#facc15;color:#000}[hidden]{display:none!important}</style>
</head><body>
<div id="ld" class="card" hidden><div class="loader"></div><p>Redirecting...</p></div>
<div id="er" class="card err" hidden><h2 id="et">Link Inactive</h2><p class="m" id="em">This link is invalid or has been deleted.</p><a href="./">Go Home</a></div>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec', TTL=3600000, isBot=/bot|crawler|spider|preview/i.test(navigator.userAgent);
const show=id=>{document.getElementById('ld').hidden=true;document.getElementById(id).hidden=false;};
const err=(t,m)=>{document.getElementById('et').textContent=t;document.getElementById('em').textContent=m;show('er');};
const click=c=>{if(!isBot)fetch(API,{method:'POST',mode:'no-cors',keepalive:true,body:JSON.stringify({action:'log_click',code:c}),headers:{'Content-Type':'text/plain'}}).catch(()=>{});};
const go=(raw,q)=>{let f;try{f=new URL(raw);}catch(_){return err('Link Inactive','Link invalid.');}
  if(f.protocol!=='http:'&&f.protocol!=='https:')return err('Link Inactive','Link invalid.');
  q.delete('code');q.forEach((v,k)=>f.searchParams.set(k,v));location.replace(f.toString()+location.hash);};
(async()=>{
  const q=new URLSearchParams(location.search); let c=q.get('code');
  if(!c){const s=location.pathname.replace(/\/+$/,'').split('/').filter(Boolean);c=s.length?s[s.length-1]:'';}
  if(!c&&location.search.length>1&&!location.search.includes('='))c=location.search.substring(1);
  try{c=decodeURIComponent(c||'');}catch(_){c='';}
  c=c.toLowerCase();
  if(!c||c==='url'||/\.html?$/i.test(c))return err('Link Inactive','Invalid or deleted link.');
  const key='linker_cache_'+c; let cached=null;
  try{cached=JSON.parse(localStorage.getItem(key)||'null');}catch(_){}
  const fresh=cached&&Date.now()-cached.t<TTL;
  if(fresh){click(c);return go(cached.u,q);}
  const spin=setTimeout(()=>show('ld'),300); // avoid flash on fast redirects
  try{
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),10000);
    const r=await fetch(API+'?code='+encodeURIComponent(c),{signal:ctl.signal}).then(r=>r.json()).finally(()=>clearTimeout(tm));
    clearTimeout(spin);
    if(r.success&&r.url){try{localStorage.setItem(key,JSON.stringify({u:r.url,t:Date.now()}));}catch(_){}click(c);go(r.url,q);}
    else{try{localStorage.removeItem(key);}catch(_){}err('Link Inactive',r.message||'Link invalid.');}
  }catch(e){clearTimeout(spin);if(cached){click(c);return go(cached.u,q);}err('Connection Problem',"Couldn't reach server.");}
})();
</script></body></html>
