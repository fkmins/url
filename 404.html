<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Linker</title><link rel="icon" href="https://files.catbox.moe/dkajo4.png">
<!-- Rule 1: Preconnects -->
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com">
<!-- Rule 9: CSP (Strict execution bounds) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https://script.google.com https://*.googleusercontent.com;">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>*,*::before,*::after{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:1rem;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}.bg-img{position:fixed;inset:0;z-index:-2;background:url('https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/27ee229500ca283e.jpg') center/cover no-repeat}.bg-overlay{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.75)}.loader{border:4px solid rgba(0,0,0,.08);border-top-color:#facc15;border-radius:50%;width:42px;height:42px;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:scale(.95)}}</style>
</head><body>
<div class="bg-img"></div><div class="bg-overlay"></div>
<div id="loadingUI" class="relative z-10 text-center bg-white p-8 rounded-3xl border-4 border-yellow-400 shadow-2xl min-w-[280px] flex flex-col items-center">
<div class="loader"></div><p id="statusText" class="text-gray-900 font-black uppercase tracking-widest text-xs">Redirecting...</p></div>
<div id="errorUI" class="hidden relative z-10 text-center bg-white p-8 rounded-3xl max-w-xs w-full border-4 border-gray-200 shadow-2xl flex-col items-center fade-in">
<h2 id="errorTitle" class="text-xl font-black text-red-600 mb-2 uppercase tracking-widest border-b-2 border-red-100 pb-2 w-full">Link Inactive</h2>
<p id="errorMsg" class="text-gray-600 mt-3 font-bold text-xs">This link is invalid or has been deleted.</p>
<a href="./" class="mt-4 inline-block bg-black text-white font-bold text-xs uppercase px-6 py-2.5 rounded-xl hover:bg-yellow-400 hover:text-black">Go Home</a></div>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';
(async function redirect() {
  let u = new URLSearchParams(window.location.search), c = u.get('code');
  if(!c) { const s = window.location.pathname.replace(/\/+$/,'').split('/').filter(Boolean); c = s.length>0 ? s[s.length-1] : ''; }
  if(!c && window.location.search.length>1 && !window.location.search.includes('=')) c = window.location.search.substring(1);
  if(!c || c.toLowerCase()==='url' || /\.html?$/i.test(c)) return err('Link Inactive', 'Invalid or deleted link.');

  // Rule 2: Client-side redirect caching
  const localCache = localStorage.getItem('linker_cache_' + c);
  if (localCache) {
    if (!/bot|crawler/i.test(navigator.userAgent)) fetch(API, {method:'POST',body:JSON.stringify({action:'log_click',code:c}),headers:{'Content-Type':'text/plain'}}).catch(()=>{});
    const fUrl = new URL(localCache); u.delete('code'); u.forEach((v,k)=>fUrl.searchParams.set(k,v));
    return window.location.replace(fUrl.toString() + window.location.hash);
  }

  try {
    const act = new AbortController(), tmr = setTimeout(()=>act.abort(), 15000);
    const r = await fetch(API+'?code='+encodeURIComponent(c)+'&_ts='+Date.now(), {signal:act.signal}).then(r=>r.json()).finally(()=>clearTimeout(tmr));
    if(r.success && r.url) {
      localStorage.setItem('linker_cache_' + c, r.url); // Save cache
      if (!/bot|crawler/i.test(navigator.userAgent)) fetch(API, {method:'POST',body:JSON.stringify({action:'log_click',code:c}),headers:{'Content-Type':'text/plain'}}).catch(()=>{});
      const fUrl = new URL(r.url); u.delete('code'); u.forEach((v,k)=>fUrl.searchParams.set(k,v));
      window.location.replace(fUrl.toString() + window.location.hash);
    } else err('Link Inactive', r.message || 'Link invalid.');
  } catch (e) { err('Connection Problem', "Couldn't reach server."); }
})();
function err(t,m){ document.getElementById('loadingUI').classList.add('hidden'); document.getElementById('errorTitle').textContent=t; document.getElementById('errorMsg').textContent=m; const e=document.getElementById('errorUI'); e.classList.remove('hidden'); e.classList.add('flex'); }
</script></body></html>
