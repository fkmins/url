<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111; color: #fff;
      display: grid; place-items: center;
      min-height: 100vh; margin: 0; text-align: center;
    }
    .card {
      background: #fff; color: #111; padding: 32px;
      border-radius: 24px; border: 4px solid #facc15;
      max-width: 320px;
    }
    .spinner {
      border: 4px solid #e5e7eb; border-top-color: #facc15;
      border-radius: 50%; width: 32px; height: 32px;
      animation: spin .7s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px; font-size: 18px; text-transform: uppercase; }
    p { font-size: 13px; font-weight: 700; color: #6b7280; margin: 0; }
    .error { color: #dc2626; }
    a.btn {
      display: inline-block; margin-top: 16px; background: #000; color: #fff;
      padding: 10px 24px; border-radius: 12px; font-size: 12px;
      font-weight: 700; text-decoration: none; text-transform: uppercase;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- Loading state -->
  <div class="card" id="loading">
    <div class="spinner"></div>
    <h2>Redirecting</h2>
    <p>Please wait…</p>
  </div>

  <!-- Error state (hidden by default) -->
  <div class="card hidden" id="error">
    <h2 class="error">Link Inactive</h2>
    <p>This link is invalid or has been deleted.</p>
    <a class="btn" href="/url/">Go Home</a>
  </div>

  <script>
    (function () {
      var GAS_URL = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';

      // Extract code from path: /url/28wans → 28wans
      var path = window.location.pathname.replace(/^\/url\//, '').replace(/\/+$/, '');

      if (!path || !/^[a-zA-Z0-9_-]{1,64}$/.test(path)) {
        showError();
        return;
      }

      // Log the click
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'log_click', code: path }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      }).catch(function () {});

      // Look up the destination
      fetch(GAS_URL + '?code=' + encodeURIComponent(path) + '&_ts=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.success && data.url) {
            window.location.replace(data.url);
          } else {
            showError();
          }
        })
        .catch(function () {
          showError();
        });

      function showError() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
