<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linker | Workspace</title>
  <link rel="icon" href="https://web.dev/static/articles/building/an-adaptive-favicon/image/example-light-theme-favic-d92b9def036e6.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0;min-height:100vh;overflow-y:auto;overflow-x:hidden}
    .bg-wolf{position:fixed;inset:0;z-index:-2;background-image:url('https://img.magnific.com/free-vector/hand-drawn-wolf-head-silhouette_23-2150523847.jpg');background-size:cover;background-position:center}
    .bg-overlay{position:fixed;inset:0;z-index:-1;background-color:rgba(0,0,0,.78)}
    .snow{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:radial-gradient(white,rgba(255,255,255,0) 2px),radial-gradient(white,rgba(255,255,255,0) 1px),radial-gradient(white,rgba(255,255,255,0) 2px);background-size:550px 550px,350px 350px,250px 250px;animation:snow-anim 20s linear infinite}
    @keyframes snow-anim{0%{background-position:0px 0px,0px 0px,0px 0px}100%{background-position:500px 1000px,400px 400px,300px 300px}}
    .btn-loader{border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;width:18px;height:18px;animation:spin .8s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    #toast{visibility:hidden;min-width:220px;background:#facc15;color:#000;text-align:center;border-radius:8px;padding:12px;position:fixed;z-index:50;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;transition:opacity .3s,bottom .3s;font-weight:900;text-transform:uppercase}
    #toast.show{visibility:visible;opacity:1;bottom:50px}
    .pulse-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 1.6s infinite}
    @keyframes pulse{0%{transform:scale(.95);box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{transform:scale(1);box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{transform:scale(.95);box-shadow:0 0 0 0 rgba(34,197,94,0)}}
    .hidden-scrollbar::-webkit-scrollbar{width:6px}
    .hidden-scrollbar::-webkit-scrollbar-track{background:transparent}
    .hidden-scrollbar::-webkit-scrollbar-thumb{background-color:#d1d5db;border-radius:20px}
    .item-enter{animation:item-in .25s ease}
    @keyframes item-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen py-8 px-4">
  <div class="bg-wolf"></div>
  <div class="bg-overlay"></div>
  <div class="snow"></div>

  <!-- AUTH -->
  <div id="authScreen" class="relative z-10 w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl text-center border-4 border-gray-200">
    <div class="flex flex-col items-center mb-8">
      <img src="https://img.magnific.com/free-vector/hand-drawn-kitsune-mask-illustration_23-2149367767.jpg" class="w-20 h-20 rounded-full border-4 border-black mb-4 object-cover shadow-lg bg-white" alt="Logo">
      <h1 class="text-3xl font-extrabold tracking-tight text-yellow-400 border-4 border-black px-5 py-2 rounded-xl bg-black uppercase shadow-lg">Linker</h1>
    </div>
    <div id="g_id_onload"
      data-client_id="1024803666625-2dsd2ebgn5h4s6pg085bmssbk4kmqdbs.apps.googleusercontent.com"
      data-context="signin" data-ux_mode="popup"
      data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
    <div class="g_id_signin flex justify-center w-full" data-type="standard" data-shape="rectangular"
      data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
  </div>

  <!-- DENIED -->
  <div id="unauthorizedModal" class="fixed inset-0 z-50 bg-black/95 hidden flex flex-col items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-white max-w-md w-full rounded-3xl border-4 border-red-500 p-8 text-center shadow-[0_0_50px_rgba(239,68,68,0.5)] flex flex-col items-center">
      <div class="flex justify-center text-red-500 mb-4">
        <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <h2 class="text-2xl font-black text-red-600 mb-2 uppercase tracking-widest">Access Denied</h2>
      <p class="text-gray-700 font-bold text-xs leading-relaxed">Your email account is not authorized to access Linker. Please close this window.</p>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="relative z-10 w-full max-w-6xl hidden">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">

      <!-- LEFT: Generator -->
      <div class="lg:col-span-5 flex flex-col h-full">
        <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-gray-200 flex-1 flex flex-col items-center">
          <div class="flex flex-col items-center mb-6 relative w-full text-center">
            <button onclick="logout()" class="absolute top-0 right-0 text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-red-600 transition-colors">Logout</button>
            <img src="https://img.magnific.com/free-vector/hand-drawn-kitsune-mask-illustration_23-2149367767.jpg" class="w-16 h-16 rounded-full border-4 border-black mb-3 object-cover shadow-lg bg-white" alt="Logo">
            <h1 class="text-2xl font-extrabold tracking-tight text-yellow-400 border-4 border-black px-4 py-1.5 rounded-xl bg-black uppercase shadow-lg">Linker</h1>
          </div>
          <form id="shortenerForm" onsubmit="event.preventDefault();handleSubmit();" class="space-y-4 w-full flex flex-col items-center">
            <input type="url" id="originalUrl" required placeholder="Paste your long URL here..."
              class="w-full text-center border-2 border-gray-200 rounded-xl px-4 py-3 bg-gray-50 text-black font-bold focus:border-black focus:bg-white outline-none text-xs transition-all">
            <div class="grid grid-cols-2 gap-3 w-full">
              <div class="flex flex-col items-center">
                <label class="block text-[10px] font-bold text-gray-900 uppercase mb-1">Custom Name</label>
                <input type="text" id="customAlias" placeholder="promo24"
                  class="w-full text-center border-2 border-gray-200 rounded-lg px-2 py-2 bg-gray-50 text-black font-medium focus:border-black focus:bg-white outline-none text-xs">
              </div>
              <div class="flex flex-col items-center">
                <label class="block text-[10px] font-bold text-gray-900 uppercase mb-1">Link Title</label>
                <input type="text" id="linkTitle" placeholder="Auto Fetch"
                  class="w-full text-center border-2 border-gray-200 rounded-lg px-2 py-2 bg-gray-50 text-black font-medium focus:border-black focus:bg-white outline-none text-xs">
              </div>
            </div>
            <button type="submit" id="submitBtn"
              class="w-full bg-black hover:bg-yellow-400 hover:text-black border-2 border-black text-white font-black py-3.5 rounded-xl transition-all flex justify-center items-center gap-2 uppercase tracking-widest shadow-md text-xs">
              <span id="btnText">Generate Link</span>
              <div id="btnLoader" class="btn-loader"></div>
            </button>
          </form>
          <div id="resultCard" class="hidden mt-4 pt-4 border-t-2 border-gray-100 w-full flex flex-col items-center">
            <p id="resultTitle" class="text-xs font-black text-gray-700 uppercase tracking-wide text-center truncate w-full mb-3"></p>
            <div class="bg-yellow-50 border-2 border-yellow-400 rounded-xl p-3 flex flex-col items-center gap-2 mb-3 shadow-sm w-full">
              <input type="text" id="shortLink" readonly class="bg-transparent text-black font-black w-full text-center outline-none cursor-text text-sm truncate">
              <button onclick="copyLink()" class="w-full bg-black text-white font-bold py-2 rounded-lg hover:bg-yellow-400 hover:text-black transition-colors uppercase border-2 border-black text-xs tracking-widest shadow-sm">Copy Link</button>
            </div>
            <button onclick="resetForm()" class="w-full bg-gray-100 hover:bg-gray-200 text-black font-bold py-2 rounded-xl text-xs transition-colors uppercase tracking-widest">Create Another</button>
          </div>
          <div id="errorBox" class="hidden mt-3 bg-red-100 text-red-900 p-2.5 rounded-xl text-xs font-bold text-center border-2 border-red-200 w-full"></div>
        </div>
      </div>

      <!-- RIGHT: Database -->
      <div class="lg:col-span-7 flex flex-col h-full">
        <div class="w-full bg-white rounded-3xl p-6 border-4 border-gray-200 shadow-2xl h-full flex flex-col items-center min-h-[500px]">
          <div class="flex flex-col items-center mb-4 pb-4 border-b-2 border-gray-100 w-full text-center">
            <h3 class="text-sm font-black text-black uppercase tracking-widest mb-2">Cloud Database</h3>
            <div class="flex items-center gap-2 bg-green-50 border border-green-300 px-3 py-1 rounded-full">
              <span class="pulse-dot"></span>
              <span class="text-[10px] text-green-800 uppercase font-black">Live Sync</span>
              <span id="syncLabel" class="text-[9px] text-green-700 font-bold ml-1"></span>
            </div>
          </div>
          <input type="text" id="searchInput" oninput="filterHistory()" placeholder="Search titles, shortcodes, or target URLs..."
            class="w-full text-center border-2 border-gray-200 rounded-xl px-4 py-2.5 mb-4 outline-none focus:border-black font-medium text-xs transition-all shadow-inner">
          <div id="modalLoader" class="flex-col items-center justify-center flex-1 flex my-8 w-full text-center">
            <div class="btn-loader border-black border-t-yellow-400 w-8 h-8 border-4 mb-3" style="display:block"></div>
            <p class="font-bold text-gray-400 uppercase tracking-widest text-[10px]">Syncing Database...</p>
          </div>
          <div id="historyList" class="flex-1 overflow-y-auto space-y-4 pr-1 hidden-scrollbar w-full" style="max-height:480px"></div>
        </div>
      </div>

    </div>
  </div>

  <div id="toast">Copied!</div>

  <script>
  const API = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';
  const DOMAIN = 'https://fkmins.github.io/url/';

  let email     = '';
  let timer     = null;
  let busy      = false;   // true while any mutation is in flight
  let tok       = 0;       // sync token — increments each call; stale responses dropped
  let history   = [];      // in-memory list, used for optimistic updates

  // ── XSS escape ─────────────────────────────────────────────────
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  // ── API ─────────────────────────────────────────────────────────
  // GET ONLY. GAS Web App URLs redirect via 302; browsers convert
  // POST→GET on redirect, silently dropping the POST body — which
  // was why delete/edit/create were failing. _ts busts browser cache.
  function api(params) {
    const qs = new URLSearchParams({ ...params, _ts: Date.now() });
    return fetch(`${API}?${qs}`, { cache: 'no-store' }).then(r => r.json());
  }

  // ── Boot ────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    api({ action: 'ping' }).catch(() => {});          // warm up GAS instance
    try {
      const s = JSON.parse(localStorage.getItem('nexusSession') || 'null');
      if (s && Date.now() - s.timestamp < 15 * 60 * 1000) {
        email = s.email;
        // Show last-known history instantly so the user sees data
        // immediately instead of staring at "Syncing Database..."
        const saved = JSON.parse(localStorage.getItem('linkerHistory') || 'null');
        if (Array.isArray(saved) && saved.length) {
          history = saved;
          hideLoader();
          render(history);
        }
        showApp();
        sync();
        return;
      }
    } catch(e) {}
    showAuth();
  });

  // ── Screen helpers ───────────────────────────────────────────────
  function showAuth() {
    clearInterval(timer);
    show('authScreen'); hide('appScreen'); hide('unauthorizedModal');
  }
  function showApp() {
    hide('authScreen'); hide('unauthorizedModal'); show('appScreen');
    clearInterval(timer);
    timer = setInterval(() => { if (email && !busy) sync(true); }, 12000);
  }
  function denyAccess() {
    localStorage.removeItem('nexusSession');
    email = ''; clearInterval(timer);
    el('historyList').innerHTML = '';
    hide('appScreen'); hide('authScreen'); show('unauthorizedModal');
  }
  function logout() {
    localStorage.removeItem('nexusSession');
    localStorage.removeItem('linkerHistory');
    email = ''; history = []; clearInterval(timer);
    el('historyList').innerHTML = '';
    showAuth();
  }

  // ── Auth ─────────────────────────────────────────────────────────
  function handleCredentialResponse(resp) {
    const b64  = resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const data = JSON.parse(decodeURIComponent(atob(b64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    email = data.email;
    localStorage.setItem('nexusSession', JSON.stringify({ email, timestamp: Date.now() }));
    showApp();
    sync();
  }

  // ── Sync ─────────────────────────────────────────────────────────
  async function sync(silent = false) {
    if (!email || busy) return;
    const myTok = ++tok;
    if (!silent && !history.length) showLoader();
    try {
      const res = await api({ action: 'history', email });
      if (myTok !== tok) return;           // a newer sync already started
      hideLoader();
      if (res.success) {
        localStorage.setItem('nexusSession', JSON.stringify({ email, timestamp: Date.now() }));
        history = res.history;
        localStorage.setItem('linkerHistory', JSON.stringify(history)); // cache for next load
        render(history);
        el('syncLabel').textContent = '· ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } else if ((res.message || '').includes('Unauthorized')) {
        denyAccess();
      }
    } catch(e) {
      if (myTok === tok) hideLoader();
    }
  }

  // ── Create ───────────────────────────────────────────────────────
  async function handleSubmit() {
    const url   = el('originalUrl').value.trim();
    const title = el('linkTitle').value.trim();
    const alias = el('customAlias').value.trim();
    const errBox = el('errorBox');
    errBox.classList.add('hidden');
    setBtn(true);
    busy = true;
    try {
      const res = await api({ action: 'create', url, title, alias, email, domain: DOMAIN });
      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { denyAccess(); return; }
        errBox.textContent = res.message; errBox.classList.remove('hidden');
      } else {
        localStorage.setItem('nexusSession', JSON.stringify({ email, timestamp: Date.now() }));
        el('shortLink').value = res.shortLink;
        el('resultTitle').textContent = res.title;
        el('resultCard').classList.remove('hidden');
        el('shortenerForm').classList.add('hidden');
        if (!res.isDuplicate) {
          const item = { title: res.title, source: url, shortCode: res.shortLink.split('/').pop(), shortLink: res.shortLink, clicks: 0 };
          history.unshift(item);
          render(history, true);
        }
      }
    } catch(e) {
      errBox.textContent = 'Network error. Please try again.'; errBox.classList.remove('hidden');
    } finally {
      busy = false;
      setBtn(false);
      sync(true);
    }
  }

  // ── Delete ───────────────────────────────────────────────────────
  async function deleteLink(code) {
    if (!confirm(`Delete /${code} permanently?`)) return;
    const idx  = history.findIndex(h => h.shortCode === code);
    const gone = idx > -1 ? history.splice(idx, 1)[0] : null;
    render(history);                        // instant removal from UI
    busy = true;
    try {
      const res = await api({ action: 'delete', code, email });
      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { denyAccess(); return; }
        alert('Error: ' + res.message);
        if (gone) { history.splice(idx, 0, gone); render(history); } // rollback
      }
    } catch(e) {
      alert('Network error. Could not delete.');
      if (gone) { history.splice(idx, 0, gone); render(history); }
    } finally {
      busy = false;
      sync(true);
    }
  }

  // ── Edit ─────────────────────────────────────────────────────────
  async function editLink(code, oldUrl) {
    const newUrl = prompt(`New target URL for /${code}:`, oldUrl);
    if (!newUrl || newUrl === oldUrl) return;
    const item    = history.find(h => h.shortCode === code);
    const prevUrl = item ? item.source : oldUrl;
    if (item) item.source = newUrl;
    render(history);                        // instant update in UI
    busy = true;
    try {
      const res = await api({ action: 'update', code, url: newUrl, email });
      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { denyAccess(); return; }
        alert('Error: ' + res.message);
        if (item) { item.source = prevUrl; render(history); } // rollback
      }
    } catch(e) {
      alert('Network error. Could not edit.');
      if (item) { item.source = prevUrl; render(history); }
    } finally {
      busy = false;
      sync(true);
    }
  }

  // ── Render ───────────────────────────────────────────────────────
  function render(data, animFirst) {
    const c = el('historyList');
    if (!data || !data.length) {
      c.innerHTML = "<div class='text-center py-12 w-full'><p class='text-gray-400 font-bold uppercase tracking-widest text-xs'>No links found.</p></div>";
      return;
    }
    c.innerHTML = data.map((item, i) => `
      <div class="bg-gray-50 p-5 rounded-3xl border-2 border-gray-200 flex flex-col items-center filter-item ${animFirst && i===0 ? 'item-enter' : ''} gap-3 shadow-sm hover:border-black transition-all text-center">
        <div class="w-full flex flex-col items-center">
          <p class="font-black text-gray-900 text-sm truncate search-target mb-1 w-full max-w-[280px]">${esc(item.title)}</p>
          <p class="text-[10px] text-gray-400 truncate search-target mb-3 font-medium w-full max-w-[280px]">${esc(item.source)}</p>
          <div class="flex flex-col items-center gap-2 mb-2 w-full">
            <a href="${esc(item.shortLink)}" target="_blank" rel="noopener noreferrer"
               class="text-xs font-black text-blue-600 truncate hover:underline search-target block w-full max-w-[280px]">${esc(item.shortLink)}</a>
            <span class="text-[10px] font-black text-gray-800 bg-yellow-300 border border-black px-3 py-1 rounded-lg">Clicks: ${parseInt(item.clicks,10)||0}</span>
          </div>
        </div>
        <div class="flex gap-2 justify-center w-full mt-1">
          <button onclick="navigator.clipboard.writeText(${JSON.stringify(item.shortLink)});showToast();"
            class="bg-black text-white px-4 py-2 rounded-xl text-xs font-black uppercase hover:bg-yellow-400 hover:text-black transition-colors shadow-sm">Copy</button>
          <button onclick="editLink(${JSON.stringify(item.shortCode)},${JSON.stringify(item.source)})"
            class="bg-blue-100 text-blue-800 px-4 py-2 rounded-xl text-xs font-black uppercase hover:bg-blue-600 hover:text-white transition-colors">Edit</button>
          <button onclick="deleteLink(${JSON.stringify(item.shortCode)})"
            class="bg-red-100 text-red-800 px-4 py-2 rounded-xl text-xs font-black uppercase hover:bg-red-600 hover:text-white transition-colors">Del</button>
        </div>
      </div>`).join('');
    filterHistory();
  }

  function filterHistory() {
    const q = el('searchInput').value.toLowerCase();
    document.querySelectorAll('.filter-item').forEach(n => {
      n.style.display = n.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
    });
  }

  function resetForm() {
    el('shortenerForm').reset();
    el('shortenerForm').classList.remove('hidden');
    el('resultCard').classList.add('hidden');
    el('errorBox').classList.add('hidden');
    el('errorBox').textContent = '';
  }

  function copyLink() {
    const inp = el('shortLink'); inp.select();
    navigator.clipboard.writeText(inp.value);
    showToast();
  }

  function showToast() {
    const t = el('toast'); t.className = 'show';
    setTimeout(() => { t.className = t.className.replace('show',''); }, 3000);
  }

  // ── UI helpers ───────────────────────────────────────────────────
  function el(id)        { return document.getElementById(id); }
  function show(id)      { el(id).classList.remove('hidden'); }
  function hide(id)      { el(id).classList.add('hidden'); }
  function showLoader()  { el('modalLoader').classList.remove('hidden'); el('modalLoader').classList.add('flex'); }
  function hideLoader()  { el('modalLoader').classList.add('hidden');    el('modalLoader').classList.remove('flex'); }
  function setBtn(on) {
    el('submitBtn').disabled   = on;
    el('btnText').textContent  = on ? 'Processing...' : 'Generate Link';
    el('btnLoader').style.display = on ? 'block' : 'none';
  }
  </script>
</body>
</html>
