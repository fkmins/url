<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routing | NexusLink</title>
  
  <!-- Universal Open Graph Tags for Social Media Previews -->
  <meta property="og:title" content="NexusLink | Enterprise Router">
  <meta property="og:description" content="Securely routing to destination...">
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Flipkart_Minutes_logo.png/800px-Flipkart_Minutes_logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="https://web.dev/static/articles/building/an-adaptive-favicon/image/example-light-theme-favic-d92b9def036e6.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; min-height: 100vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; background-color: #ffffff;}
    
    .bg-watermark {
      position: fixed; inset: 0; z-index: -2;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Flipkart_Minutes_logo.png/800px-Flipkart_Minutes_logo.png');
      background-size: 300px; background-position: center; background-repeat: no-repeat; opacity: 0.15;
    }

    .loader { border: 4px solid rgba(0,0,0,0.1); border-top-color: #facc15; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="bg-watermark"></div>

  <div id="loadingUI" class="relative z-10 text-center bg-white p-8 rounded-3xl border-4 border-yellow-400 shadow-2xl">
    <div class="loader"></div>
    <h1 class="text-3xl font-extrabold tracking-tight text-yellow-400 border-4 border-black p-3 rounded-xl bg-black mb-4 uppercase inline-block shadow-lg">NexusLink</h1>
    <p class="text-gray-900 mt-2 font-bold uppercase tracking-widest text-xs" id="statusText">Locating Target...</p>
  </div>

  <div id="errorUI" class="hidden relative z-10 text-center bg-white p-8 rounded-3xl max-w-sm w-full border-4 border-gray-200 shadow-2xl">
    <h1 class="text-3xl font-extrabold tracking-tight text-yellow-400 border-4 border-black p-3 rounded-xl bg-black mb-6 uppercase inline-block shadow-lg">NexusLink</h1>
    <h2 class="text-xl font-black text-red-600 mb-2 uppercase">Link Inactive</h2>
    <p class="text-gray-600 mb-8 font-bold text-xs" id="errorReason">This link has expired, was typed incorrectly, or was permanently deleted by the creator.</p>
    <a href="/url/" class="block w-full bg-black text-white px-4 py-4 rounded-xl font-black uppercase tracking-widest hover:bg-yellow-400 hover:text-black border-2 border-black transition-colors shadow-lg text-sm">Create a Link</a>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';

    async function routeUser() {
      const pathSegments = window.location.pathname.split('/').filter(p => p);
      const shortCode = pathSegments[pathSegments.length - 1];

      if (!shortCode || shortCode === 'url' || shortCode.includes('.html')) return showError();

      try {
        const response = await fetch(`${SCRIPT_URL}?code=${shortCode}`);
        const data = await response.json();

        if (data.success && data.url) {
          document.getElementById('statusText').innerText = "Target acquired. Redirecting...";
          document.getElementById('statusText').classList.replace('text-gray-900', 'text-yellow-500');
          window.location.replace(data.url);
        } else showError(); // Specifically handles the "Deleted/Deactivated" response
      } catch (err) { showError(); }
    }

    function showError() {
      document.getElementById('loadingUI').classList.add('hidden');
      document.getElementById('errorUI').classList.remove('hidden');
    }
    routeUser();
  </script>
</body>
</html>
