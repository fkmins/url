<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routing | NexusLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #000000; color: #ffffff; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
    .loader { border: 4px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loadingUI" class="text-center">
    <div class="loader"></div>
    <h1 class="text-xl font-bold tracking-widest uppercase">Nexus Routing</h1>
    <p class="text-gray-400 mt-2" id="statusText">Locating destination...</p>
  </div>

  <div id="errorUI" class="hidden text-center bg-white p-8 rounded-xl max-w-sm mx-4 text-black">
    <h2 class="text-2xl font-bold text-red-600 mb-2">Link Not Found</h2>
    <p class="text-gray-600 mb-6" id="errorReason">The link you clicked has expired or does not exist.</p>
    <a href="/url/" class="bg-black text-white px-6 py-3 rounded-lg font-bold">Create a Link</a>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';

    async function routeUser() {
      // Extract code (e.g. "hzqu45") from the GitHub Pages URL
      const pathSegments = window.location.pathname.split('/').filter(p => p);
      const shortCode = pathSegments[pathSegments.length - 1];

      if (!shortCode || shortCode === 'url' || shortCode.includes('.html')) {
        document.getElementById('loadingUI').classList.add('hidden');
        document.getElementById('errorUI').classList.remove('hidden');
        return;
      }

      try {
        const response = await fetch(`${SCRIPT_URL}?code=${shortCode}`);
        const data = await response.json();

        if (data.success && data.url) {
          document.getElementById('statusText').innerText = "Target acquired. Redirecting...";
          document.getElementById('statusText').classList.add('text-blue-400');
          window.location.replace(data.url);
        } else {
          throw new Error("Link missing from database");
        }
      } catch (err) {
        document.getElementById('loadingUI').classList.add('hidden');
        document.getElementById('errorUI').classList.remove('hidden');
      }
    }

    routeUser();
  </script>
</body>
</html>
