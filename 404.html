<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linker</title>
  <link rel="icon" href="https://files.catbox.moe/dkajo4.png">
  <meta property="og:title" content="Linker">
  <meta property="og:description" content="Linker — Private URL Shortener">
  <meta property="og:image" content="https://files.catbox.moe/dkajo4.png">
  <meta name="twitter:card" content="summary">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0; padding: 1rem; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .bg-img {
      position: fixed; inset: 0; z-index: -2;
      background: url('https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/27ee229500ca283e.jpg') center/cover no-repeat;
    }
    .bg-overlay {
      position: fixed; inset: 0; z-index: -1; background: rgba(0,0,0,.75);
    }
    .loader {
      border: 4px solid rgba(0,0,0,.08); border-top-color: #facc15;
      border-radius: 50%; width: 42px; height: 42px; animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(.95); } }
  </style>
</head>
<body>

  <div class="bg-img"></div>
  <div class="bg-overlay"></div>

  <div id="loadingUI" class="relative z-10 text-center bg-white p-8 rounded-3xl border-4 border-yellow-400 shadow-2xl min-w-[280px] flex flex-col items-center">
    <div class="loader"></div>
    <p id="statusText" class="text-gray-900 font-black uppercase tracking-widest text-xs">Sending you there >></p>
    <a id="manualLink" href="#" class="hidden mt-4 text-[10px] font-bold text-blue-600 underline">Tap here to continue</a>
  </div>

  <div id="errorUI" class="hidden relative z-10 text-center bg-white p-8 rounded-3xl max-w-xs w-full border-4 border-gray-200 shadow-2xl flex-col items-center fade-in">
    <svg class="w-14 h-14 text-red-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <h2 id="errorTitle" class="text-xl font-black text-red-600 mb-2 uppercase tracking-widest border-b-2 border-red-100 pb-2 w-full">Link Inactive</h2>
    <p id="errorMsg" class="text-gray-600 mt-3 font-bold text-xs leading-relaxed">This link is invalid or has been deleted.</p>
    <a href="./" class="mt-4 inline-block bg-black text-white font-bold text-xs uppercase tracking-widest px-6 py-2.5 rounded-xl hover:bg-yellow-400 hover:text-black transition-colors">Go Home</a>
  </div>

  <script>
  'use strict';
  const API = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';
  const FETCH_TIMEOUT_MS = 8000;

  function fetchWithTimeout(url, ms) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    return fetch(url, { cache: 'no-store', signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  (async function redirect() {
    let code = new URLSearchParams(window.location.search).get('code');
    if (!code) {
      const segs = window.location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
      code = segs.length > 0 ? segs[segs.length - 1] : '';
    }
    if (!code && window.location.search.length > 1 && !window.location.search.includes('=')) {
      code = window.location.search.substring(1);
    }
    if (!code || code.toLowerCase() === 'url' || /\.html?$/i.test(code)) {
      return showError('Link Inactive', 'This link is invalid or has been deleted.');
    }

    const slowTimer = setTimeout(() => {
      document.getElementById('manualLink').href = '#';
      document.getElementById('manualLink').classList.remove('hidden');
    }, 4000);

    try {
      const res = await fetchWithTimeout(API + '?code=' + encodeURIComponent(code) + '&_ts=' + Date.now(), FETCH_TIMEOUT_MS).then(r => r.json());
      clearTimeout(slowTimer);

      if (res.success && res.url) {
        // Rule 14: Check for preview bots before firing the click tracker
        const ua = navigator.userAgent.toLowerCase();
        const isBot = /bot|crawler|spider|crawling|facebook|twitter|slack|whatsapp|telegram|discord/i.test(ua);
        
        if (!isBot) {
          // Rule 10: Asynchronous, non-blocking click register
          fetch(API, { method: 'POST', body: JSON.stringify({ action: 'log_click', code: code }) }).catch(()=>{});
        }

        // Rule 12: Forward incoming query parameters to the destination url
        const finalUrl = new URL(res.url);
        const incomingParams = new URLSearchParams(window.location.search);
        incomingParams.delete('code'); // drop internal parameter
        incomingParams.forEach((v, k) => finalUrl.searchParams.set(k, v));

        document.getElementById('statusText').textContent = 'Redirecting…';
        window.location.replace(finalUrl.toString() + window.location.hash);
      } else {
        showError('Link Inactive', res.message || 'This link is invalid or has been deleted.');
      }
    } catch (err) {
      clearTimeout(slowTimer);
      showError('Connection Problem', "Couldn't reach the server. Check your connection.");
    }
  })();

  function showError(title, msg) {
    document.getElementById('loadingUI').classList.add('hidden');
    document.getElementById('errorTitle').textContent = title;
    document.getElementById('errorMsg').textContent = msg;
    const err = document.getElementById('errorUI');
    err.classList.remove('hidden');
    err.classList.add('flex');
  }
  </script>
</body>
</html>
