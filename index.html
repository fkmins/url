<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linker</title>
  <link rel="icon" href="https://files.catbox.moe/dkajo4.png">
  <meta name="description" content="Linker — Private URL Shortener Workspace">
  <meta property="og:title" content="Linker">
  <meta property="og:image" content="https://files.catbox.moe/dkajo4.png">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0; padding: 0;
      min-height: 100vh;
      overflow-y: auto; overflow-x: hidden;
    }

    .bg-wolf    { position: fixed; inset: 0; z-index: -2;
                  background: url('https://wallpaperaccess.com/full/8532104.jpg') center/cover no-repeat; }
    .bg-overlay { position: fixed; inset: 0; z-index: -1;
                  background: rgba(0,0,0,.80); }

    .snow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(white, rgba(255,255,255,0) 2px),
        radial-gradient(white, rgba(255,255,255,0) 1px),
        radial-gradient(white, rgba(255,255,255,0) 2px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      animation: snow 20s linear infinite;
    }
    @keyframes snow {
      to { background-position: 500px 1000px, 400px 400px, 300px 300px; }
    }

    .spinner {
      border: 3px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; width: 18px; height: 18px;
      animation: spin .7s linear infinite; display: none;
    }
    .spinner-dark {
      border: 4px solid rgba(0,0,0,.08); border-top-color: #facc15;
      border-radius: 50%; width: 36px; height: 36px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
      visibility: hidden; min-width: 200px;
      background: #facc15; color: #000; text-align: center;
      border-radius: 10px; padding: 12px 20px;
      position: fixed; z-index: 100; left: 50%; bottom: 30px;
      transform: translateX(-50%); opacity: 0;
      transition: opacity .25s, bottom .25s;
      font-weight: 900; text-transform: uppercase; font-size: 12px;
      box-shadow: 0 4px 20px rgba(250,204,21,.4);
    }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

    .pulse-dot {
      width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(34,197,94,.7);
      animation: pulse 1.6s infinite;
    }
    .pulse-dot.offline { background: #f59e0b; animation: none; box-shadow: none; }
    @keyframes pulse {
      0%   { transform: scale(.95); box-shadow: 0 0 0 0   rgba(34,197,94,.7); }
      70%  { transform: scale(1);   box-shadow: 0 0 0 8px rgba(34,197,94,0);  }
      100% { transform: scale(.95); box-shadow: 0 0 0 0   rgba(34,197,94,0);  }
    }

    .slim-scroll::-webkit-scrollbar       { width: 5px; }
    .slim-scroll::-webkit-scrollbar-track { background: transparent; }
    .slim-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

    .item-enter { animation: item-in .25s ease; }
    @keyframes item-in { from { opacity: 0; transform: translateY(-8px); } }

    .modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6);
                      display: none; align-items: center; justify-content: center;
                      backdrop-filter: blur(4px); }
    .modal-backdrop.open { display: flex; }

    [data-action]:disabled { opacity: .5; cursor: wait; }

    .diag { font-size: 10px; color: #9ca3af; margin-top: 12px; }
    .diag .ok  { color: #22c55e; }
    .diag .err { color: #ef4444; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen py-8 px-4">

  <!-- ======================== MAIN APP ======================== -->
  <div id="appScreen" class="relative z-10 w-full max-w-6xl hidden">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">

      <!-- LEFT: Create short link -->
      <div class="lg:col-span-5 flex flex-col h-full">
        <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-gray-200

  <script>
  'use strict';

  /* ═══════════════════════════  CONFIG  ═══════════════════════════ */

  // !! IMPORTANT !! — After creating a NEW deployment of your Apps Script,
  // paste the new /exec URL here.  Simply saving the script is NOT enough;
  // you must do  Deploy → New deployment → Web app → copy the URL.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';

  // The base URL where short links resolve.  Must end with a slash.
  // This must match the GitHub Pages URL where 404.html is deployed.
  const DOMAIN     = 'https://fkmins.github.io/url/';

  const SESSION_KEY    = 'linkerSession';
  const HISTORY_KEY    = 'linkerHistory';
  const SESSION_TTL    = 15 * 60 * 1000;   // 15 min
  const SYNC_INTERVAL  = 12000;            // 12 s
  const API_TIMEOUT    = 15000;            // 15 s per attempt
  const API_RETRIES    = 2;

  /* ═══════════════════════════  STATE  ════════════════════════════ */

  let currentEmail  = '';
  let syncTimer     = null;
  let isMutating    = false;
  let syncSeq       = 0;
  let cachedHistory = [];
  let pendingCodes  = new Set();
  let deniedWasNetworkError = false;

  /* ═══════════════════════════  HELPERS  ══════════════════════════ */

  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function log(tag, ...args)  { console.log('[Linker ' + tag + ']', ...args); }
  function warn(tag, ...args) { console.warn('[Linker ' + tag + ']', ...args); }
  function logErr(tag, ...args)  { console.error('[Linker ' + tag + ']', ...args); }

  /* ═══════════════════════════  API LAYER  ════════════════════════ */

  // Google Apps Script web apps respond with a 302 → the fetch API follows
  // the redirect automatically.  We add an AbortController timeout and
  // detect HTML responses (sign of a misconfigured deployment).
  async function rawApi(params) {
    const qs  = new URLSearchParams({ ...params, _ts: Date.now() }).toString();
    const url = SCRIPT_URL + '?' + qs;
    log('API', 'GET', url.substring(0, 120) + '…');

    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), API_TIMEOUT);

    try {
      const r = await fetch(url, {
        cache: 'no-store',
        redirect: 'follow',
        signal: ctrl.signal
      });
      clearTimeout(timer);

      // If Apps Script is deployed as "Anyone with Google account" instead
      // of "Anyone", Google returns an HTML login page instead of JSON.
      const ct = r.headers.get('content-type') || '';
      if (!r.ok) {
        logErr('API', 'HTTP', r.status, r.statusText);
        throw new Error('HTTP ' + r.status);
      }
      if (ct.includes('text/html')) {
        logErr('API', 'Got HTML instead of JSON — your Apps Script deployment is',
            'likely set to "Anyone with Google account" instead of "Anyone".',
            'Redeploy with access = Anyone.');
        throw new Error('API returned HTML (check deployment access)');
      }

      const body = await r.json();
      log('API', 'Response:', body);
      return body;
    } catch (e) {
      clearTimeout(timer);
      throw e;
    }
  }

  async function api(params, attempts) {
    attempts = attempts || API_RETRIES;
    let lastErr;
    for (let i = 0; i < attempts; i++) {
      try {
        return await rawApi(params);
      } catch (e) {
        lastErr = e;
        warn('API', 'Attempt', i + 1, 'failed:', e.message);
        if (i < attempts - 1) await sleep(600 * Math.pow(2, i));
      }
    }
    logErr('API', 'All', attempts, 'attempts failed:', lastErr);
    return { success: false, message: 'Network error — check your connection.', _networkError: true };
  }

  /* ═══════════════════════════  BOOT  ═════════════════════════════ */

  window.addEventListener('load', () => {
    log('BOOT', 'Page loaded');
    runDiagnostics();

    // Try to resume a stored session
    try {
      const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      if (sess && Date.now() - sess.ts < SESSION_TTL) {
        log('BOOT', 'Resuming session for', sess.email);
        currentEmail = sess.email;

        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || 'null');
        if (Array.isArray(saved) && saved.length) {
          cachedHistory = saved;
          hideLoader();
          renderLinks(cachedHistory);
        }
        showApp();
        syncData();
        return;
      }
    } catch (_) {}

    log('BOOT', 'No valid session — showing sign-in');
    showAuth();
  });

  // Pause sync when tab is hidden; catch up immediately when visible again.
  document.addEventListener('visibilitychange', () => {
    if (!currentEmail) return;
    if (document.visibilityState === 'visible') {
      startSync();
      syncData(true);
    } else {
      stopSync();
    }
  });

  /* ═══════════════════════════  DIAGNOSTICS  ═════════════════════ */

  async function runDiagnostics() {
    // 1. Check API connectivity
    try {
      const res = await rawApi({ action: 'ping' });
      $('diagApi').textContent = 'API: ' + (res.success ? '✓ OK' : '✗ Error');
      $('diagApi').className   = res.success ? 'ok' : 'err';
    } catch (e) {
      $('diagApi').textContent = 'API: ✗ Unreachable';
      $('diagApi').className   = 'err';
      logErr('DIAG', 'API ping failed:', e.message);
    }

    // 2. Check Google Identity Services
    setTimeout(() => {
      const gisOk = typeof google !== 'undefined' && google.accounts && google.accounts.id;
      $('diagGis').textContent = 'GIS: ' + (gisOk ? '✓ Loaded' : '✗ Not loaded');
      $('diagGis').className   = gisOk ? 'ok' : 'err';
      if (!gisOk) logErr('DIAG', 'Google Identity Services library did not load.',
                       'Check ad-blockers, network, or CSP headers.');
    }, 2500);
  }

  /* ═══════════════════════════  SCREEN SWITCHING  ════════════════ */

  function showAuth() {
    stopSync();
    $('appScreen').classList.add('hidden');
    $('unauthorizedModal').classList.add('hidden');
    $('unauthorizedModal').classList.remove('flex');
    $('authScreen').classList.remove('hidden');
  }

  function showApp() {
    $('authScreen').classList.add('hidden');
    $('unauthorizedModal').classList.add('hidden');
    $('unauthorizedModal').classList.remove('flex');
    $('appScreen').classList.remove('hidden');
    startSync();
  }

  function showDenied(isNetworkError) {
    deniedWasNetworkError = !!isNetworkError;
    if (!isNetworkError) {
      localStorage.removeItem(SESSION_KEY);
      currentEmail = '';
      cachedHistory = [];
    }
    stopSync();
    $('linksContainer').innerHTML = '';
    $('appScreen').classList.add('hidden');
    $('authScreen').classList.add('hidden');

    if (isNetworkError) {
      $('deniedTitle').textContent = 'Connection Problem';
      $('deniedText').innerHTML    = "Couldn't reach the server. Check your connection and try again.";
      $('deniedRetryBtn').classList.remove('hidden');
    } else {
      $('deniedTitle').textContent = 'Access Denied';
      $('deniedText').innerHTML    = 'You are not authorized to use this site.<br>Please contact <strong>dhrubajyotid1.vc</strong>';
      $('deniedRetryBtn').classList.add('hidden');
    }

    $('unauthorizedModal').classList.remove('hidden');
    $('unauthorizedModal').classList.add('flex');
  }

  function retryAfterDenied() {
    $('unauthorizedModal').classList.add('hidden');
    $('unauthorizedModal').classList.remove('flex');
    try {
      const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      if (sess && Date.now() - sess.ts < SESSION_TTL) {
        currentEmail = sess.email;
        showApp();
        syncData();
        return;
      }
    } catch (_) {}
    showAuth();
  }

  function showLoader() { $('listLoader').classList.remove('hidden'); $('listLoader').classList.add('flex'); }
  function hideLoader() { $('listLoader').classList.add('hidden');    $('listLoader').classList.remove('flex'); }

  /* ═══════════════════════════  GOOGLE SIGN-IN  ══════════════════ */

  function handleCredentialResponse(response) {
    log('AUTH', 'Credential received, decoding…');

    let email;
    try {
      const b64     = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const payload = JSON.parse(decodeURIComponent(
        atob(b64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
      ));
      email = payload.email;
      log('AUTH', 'Decoded email:', email);
    } catch (e) {
      logErr('AUTH', 'Failed to decode Google credential:', e);
      showToast('Sign-in error — please try again', true);
      return;
    }

    // Show a visible "verifying" status
    $('authStatus').textContent = 'Verifying your account…';
    $('authStatus').classList.remove('hidden');

    // Verify with the backend (fetches history = proves the email is allowed)
    api({ action: 'history', email: email }).then(res => {
      if (res.success) {
        log('AUTH', 'Authorized ✓  links:', (res.history || []).length);
        currentEmail = email;
        saveSession();
        cachedHistory = res.history || [];
        localStorage.setItem(HISTORY_KEY, JSON.stringify(cachedHistory));
        hideLoader();
        renderLinks(cachedHistory);
        stampSync();
        showApp();
      } else {
        warn('AUTH', 'Denied:', res.message);
        $('authStatus').classList.add('hidden');
        showDenied(!!res._networkError);
      }
    }).catch(e => {
      logErr('AUTH', 'Unexpected error during auth:', e);
      $('authStatus').classList.add('hidden');
      showDenied(true);
    });
  }

  function logout() {
    log('AUTH', 'Logging out');
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(HISTORY_KEY);
    currentEmail = '';
    cachedHistory = [];
    stopSync();
    $('linksContainer').innerHTML = '';
    showAuth();
  }

  function saveSession() {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ email: currentEmail, ts: Date.now() }));
  }

  /* ═══════════════════════════  SYNC  ═════════════════════════════ */

  function startSync() {
    stopSync();
    if (document.visibilityState === 'hidden') return;
    syncTimer = setInterval(() => {
      if (currentEmail && !isMutating) syncData(true);
    }, SYNC_INTERVAL);
  }

  function stopSync() {
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
  }

  async function syncData(silent) {
    if (!currentEmail || isMutating) return;
    const mySeq = ++syncSeq;

    if (!silent && !cachedHistory.length) showLoader();

    const res = await api({ action: 'history', email: currentEmail });
    if (mySeq !== syncSeq) return;          // stale response

    hideLoader();

    if (res.success) {
      setSyncIndicator(true);
      saveSession();
      cachedHistory = res.history || [];
      localStorage.setItem(HISTORY_KEY, JSON.stringify(cachedHistory));
      renderLinks(cachedHistory);
      stampSync();
    } else if (res._networkError) {
      setSyncIndicator(false);               // transient — keep showing cached data
    } else if ((res.message || '').includes('Unauthorized')) {
      showDenied(false);
    }
  }

  function setSyncIndicator(online) {
    $('syncDot').classList.toggle('offline', !online);
  }

  function stampSync() {
    $('lastSyncedLabel').textContent = '· ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  /* ═══════════════════════════  CREATE  ═══════════════════════════ */

  async function handleSubmit() {
    const url    = $('originalUrl').value.trim();
    const title  = $('linkTitle').value.trim();
    const alias  = $('customAlias').value.trim();
    const errBox = $('errorBox');

    if (!url) {
      errBox.textContent = 'Please enter a URL.';
      errBox.classList.remove('hidden');
      return;
    }

    errBox.classList.add('hidden');
    $('submitBtn').disabled       = true;
    $('btnText').textContent      = 'Wait, generating';
    $('btnLoader').style.display  = 'block';
    isMutating = true;

    try {
      log('CREATE', 'Sending create request…', { url, title, alias });

      const res = await api({
        action: 'create', url: url, title: title, alias: alias,
        email: currentEmail, domain: DOMAIN
      });

      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { showDenied(false); return; }
        errBox.textContent = res.message || 'Something went wrong.';
        errBox.classList.remove('hidden');
        warn('CREATE', 'Server said no:', res.message);
        return;
      }

      log('CREATE', 'Success:', res);
      saveSession();
      $('shortLink').value        = res.shortLink;
      $('resultTitle').textContent = res.title || 'Link Created';
      $('resultCard').classList.remove('hidden');
      $('shortenerForm').classList.add('hidden');

      if (res.isDuplicate) {
        $('resultDupNote').textContent = res.message || 'This URL was already shortened.';
        $('resultDupNote').classList.remove('hidden');
      } else {
        $('resultDupNote').classList.add('hidden');
        cachedHistory.unshift({
          title: res.title, source: url,
          shortCode: res.shortLink.replace(DOMAIN, ''),
          shortLink: res.shortLink, clicks: 0
        });
        renderLinks(cachedHistory, true);
      }

    } catch (e) {
      logErr('CREATE', 'Unexpected error:', e);
      errBox.textContent = 'Unexpected error: ' + e.message;
      errBox.classList.remove('hidden');
    } finally {
      isMutating = false;
      $('submitBtn').disabled      = false;
      $('btnText').textContent     = 'Generate a Short Url';
      $('btnLoader').style.display = 'none';
      syncData(true);
    }
  }

  function resetForm() {
    $('shortenerForm').reset();
    $('shortenerForm').classList.remove('hidden');
    $('resultCard').classList.add('hidden');
    $('resultDupNote').classList.add('hidden');
    $('errorBox').classList.add('hidden');
    $('errorBox').textContent = '';
    $('originalUrl').focus();
  }

  /* ═══════════════════════════  DELETE  ═══════════════════════════ */

  async function deleteLink(code) {
    if (pendingCodes.has(code)) return;
    if (!confirm('Permanently delete /' + code + '?')) return;

    log('DELETE', 'Deleting', code);
    pendingCodes.add(code);
    renderLinks(cachedHistory);

    const idx     = cachedHistory.findIndex(h => h.shortCode === code);
    const removed = idx > -1 ? cachedHistory.splice(idx, 1)[0] : null;
    renderLinks(cachedHistory);

    isMutating = true;
    try {
      const res = await api({ action: 'delete', code: code, email: currentEmail });
      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { showDenied(false); return; }
        showToast(res.message || 'Delete failed', true);
        if (removed && idx > -1) { cachedHistory.splice(idx, 0, removed); renderLinks(cachedHistory); }
      } else {
        showToast('Deleted!');
      }
    } catch (e) {
      logErr('DELETE', e);
      showToast('Delete failed — network error', true);
      if (removed && idx > -1) { cachedHistory.splice(idx, 0, removed); renderLinks(cachedHistory); }
    } finally {
      pendingCodes.delete(code);
      isMutating = false;
      syncData(true);
    }
  }

  /* ═══════════════════════════  EDIT  ═════════════════════════════ */

  function openEditModal(code, currentUrl, currentTitle) {
    $('editCode').value        = code;
    $('editCodeDisplay').value = '/' + code;
    $('editUrl').value         = currentUrl;
    $('editTitle').value       = currentTitle;
    $('editError').classList.add('hidden');
    $('editModal').classList.add('open');
    $('editUrl').focus();
  }

  function closeEditModal() {
    $('editModal').classList.remove('open');
  }

  async function submitEdit() {
    const code     = $('editCode').value;
    const newUrl   = $('editUrl').value.trim();
    const newTitle = $('editTitle').value.trim();

    if (!newUrl) {
      $('editError').textContent = 'URL cannot be empty.';
      $('editError').classList.remove('hidden');
      return;
    }

    $('editSaveBtn').disabled          = true;
    $('editSaveText').textContent      = 'Saving…';
    $('editSaveLoader').style.display  = 'block';
    $('editError').classList.add('hidden');

    const item    = cachedHistory.find(h => h.shortCode === code);
    const prevUrl = item ? item.source : newUrl;
    const prevTtl = item ? item.title  : '';
    if (item) {
      item.source = newUrl;
      if (newTitle) item.title = newTitle;
    }
    renderLinks(cachedHistory);

    isMutating = true;
    try {
      const params = { action: 'update', code: code, url: newUrl, email: currentEmail };
      if (newTitle) params.title = newTitle;
      const res = await api(params);

      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { showDenied(false); return; }
        $('editError').textContent = res.message || 'Update failed.';
        $('editError').classList.remove('hidden');
        if (item) { item.source = prevUrl; item.title = prevTtl; renderLinks(cachedHistory); }
        return;
      }

      showToast('Updated!');
      closeEditModal();
    } catch (e) {
      logErr('EDIT', e);
      $('editError').textContent = 'Network error — please retry.';
      $('editError').classList.remove('hidden');
      if (item) { item.source = prevUrl; item.title = prevTtl; renderLinks(cachedHistory); }
    } finally {
      isMutating = false;
      $('editSaveBtn').disabled         = false;
      $('editSaveText').textContent     = 'Save';
      $('editSaveLoader').style.display = 'none';
      syncData(true);
    }
  }

  $('editModal')?.addEventListener('click', e => {
    if (e.target === $('editModal')) closeEditModal();
  });

  document.addEventListener('keydown', e => {
    if (!$('editModal').classList.contains('open')) return;
    if (e.key === 'Escape') closeEditModal();
    if (e.key === 'Enter' && (e.target === $('editUrl') || e.target === $('editTitle'))) submitEdit();
  });

  /* ═══════════════════════════  RENDER  ═══════════════════════════ */

  function renderLinks(data, animateFirst) {
    const c = $('linksContainer');
    c.classList.remove('hidden');

    if (!data || !data.length) {
      c.innerHTML = '<div class="text-center py-12 w-full">' +
        '<p class="text-gray-400 font-bold uppercase tracking-widest text-xs">No links yet</p></div>';
      return;
    }

    c.innerHTML = data.map((item, i) => {
      const code   = esc(item.shortCode);
      const src    = esc(item.source);
      const title  = esc(item.title);
      const link   = esc(item.shortLink);
      const clicks = parseInt(item.clicks, 10) || 0;
      const busy   = pendingCodes.has(item.shortCode);

      return '<div class="bg-gray-50 p-5 rounded-3xl border-2 border-gray-200 flex flex-col items-center ' +
        'filter-item gap-3 shadow-sm hover:border-black transition-all text-center' +
        (animateFirst && i === 0 ? ' item-enter' : '') + '">' +
        '<div class="w-full flex flex-col items-center">' +
          '<p class="font-black text-gray-900 text-sm truncate search-target mb-1 w-full max-w-[300px]">' + title + '</p>' +
          '<p class="text-[10px] text-gray-400 truncate search-target mb-3 font-medium w-full max-w-[300px]">' + src + '</p>' +
          '<div class="flex flex-col items-center gap-2 mb-2 w-full">' +
            '<a href="' + link + '" target="_blank" rel="noopener noreferrer" ' +
              'class="text-xs font-black text-blue-600 truncate hover:underline search-target block w-full max-w-[300px]">' + link + '</a>' +
            '<span class="text-[10px] font-black text-gray-800 bg-yellow-300 border border-black px-3 py-1 rounded-lg">' +
              'Clicks: ' + clicks + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-2 justify-center w-full mt-1">' +
          '<button data-action="copy" data-link="' + link + '" ' +
            'class="bg-black text-white px-4 py-2 rounded-xl text-xs font-black uppercase ' +
            'hover:bg-yellow-400 hover:text-black transition-colors shadow-sm">Copy</button>' +
          '<button data-action="edit" data-code="' + code + '" data-url="' + src + '" data-title="' + title + '" ' + (busy ? 'disabled' : '') + ' ' +
            'class="bg-blue-100 text-blue-800 px-4 py-2 rounded-xl text-xs font-black uppercase ' +
            'hover:bg-blue-600 hover:text-white transition-colors">Edit</button>' +
          '<button data-action="del" data-code="' + code + '" ' + (busy ? 'disabled' : '') + ' ' +
            'class="bg-red-100 text-red-800 px-4 py-2 rounded-xl text-xs font-black uppercase ' +
            'hover:bg-red-600 hover:text-white transition-colors">' + (busy ? '…' : 'Del') + '</button>' +
        '</div>' +
      '</div>';
    }).join('');

    filterHistory();
  }

  $('linksContainer')?.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;

    const action = btn.dataset.action;
    if (action === 'copy') {
      copyToClipboard(btn.dataset.link);
    } else if (action === 'edit') {
      openEditModal(btn.dataset.code, btn.dataset.url, btn.dataset.title);
    } else if (action === 'del') {
      deleteLink(btn.dataset.code);
    }
  });

  function filterHistory() {
    const q = $('searchInput').value.toLowerCase();
    document.querySelectorAll('.filter-item').forEach(node => {
      const haystack = Array.from(node.querySelectorAll('.search-target'))
        .map(n => n.textContent).join(' ').toLowerCase();
      node.style.display = haystack.includes(q) ? 'flex' : 'none';
    });
  }

  /* ═══════════════════════════  CLIPBOARD / TOAST  ═══════════════ */

  async function copyToClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showToast('Link Copied');
    } catch (_) {
      showToast('Could not copy — long-press to copy manually', true);
    }
  }

  function copyLink() {
    copyToClipboard($('shortLink').value);
  }

  function showToast(msg, isError) {
    const t = $('toast');
    t.textContent  = msg || 'Done';
    t.style.background = isError ? '#ef4444' : '#facc15';
    t.style.color      = isError ? '#fff'    : '#000';
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove('show'), 3000);
  }
  </script>
</body>
