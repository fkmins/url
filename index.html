<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusLink | Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    
    .loader {
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .blob {
      position: absolute; filter: blur(100px); opacity: 0.4; z-index: -1;
      border-radius: 50%; mix-blend-mode: multiply; animation: pulse 8s infinite alternate;
    }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <div class="blob bg-blue-600 w-96 h-96 top-0 left-0"></div>
  <div class="blob bg-purple-600 w-96 h-96 bottom-0 right-0" style="animation-delay: 2s;"></div>

  <div class="glass rounded-3xl p-8 w-full max-w-md relative shadow-2xl">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">NexusLink</h1>
      <p class="text-slate-400 text-sm mt-1">Professional URL Shortener</p>
    </div>

    <form id="shortenerForm" onsubmit="event.preventDefault(); handleSubmit();" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1.5">Link Title <span class="text-slate-500 font-normal">(Optional)</span></label>
        <input type="text" id="linkTitle" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="e.g. Q3 Marketing Deck">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1.5">Target URL</label>
        <input type="url" id="originalUrl" required class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="https://example.com/very-long-link">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition-all flex justify-center items-center gap-2 mt-2">
        <span id="btnText">Shrink URL</span>
        <div id="btnLoader" class="loader"></div>
      </button>
    </form>

    <div id="resultCard" class="hidden mt-6 pt-6 border-t border-slate-700/50 transition-all">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-medium text-slate-300">Your Short Link</span>
        <span id="statusBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full"></span>
      </div>
      
      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex items-center justify-between gap-3 mb-5">
        <div id="shortLink" class="text-blue-400 font-medium truncate select-all px-2"></div>
        <button onclick="copyLink()" id="copyBtn" class="shrink-0 bg-slate-700 hover:bg-slate-600 p-2.5 rounded-lg text-slate-200 transition-colors" title="Copy to clipboard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        </button>
      </div>

      <div class="flex gap-3">
        <button onclick="toggleQR()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-medium py-2.5 rounded-xl transition-all text-sm flex items-center justify-center gap-2">
          QR Code
        </button>
        <button onclick="resetForm()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-medium py-2.5 rounded-xl transition-all text-sm">
          Create Another
        </button>
      </div>

      <div id="qrBox" class="hidden mt-5 text-center">
        <div class="bg-white p-3 rounded-xl inline-block shadow-lg">
          <img id="qrImage" src="" alt="QR Code" class="w-40 h-40">
        </div>
      </div>
    </div>
    
    <div id="errorBox" class="hidden mt-4 bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl text-sm text-center"></div>
  </div>

  <script>
    // --- IMPORTANT: PASTE YOUR DEPLOYED WEB APP URL HERE ---
    const SCRIPT_URL = 'YOUR_WEB_APP_URL_HERE'; 

    async function handleSubmit() {
      const title = document.getElementById('linkTitle').value;
      const url = document.getElementById('originalUrl').value;
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnLoader = document.getElementById('btnLoader');
      const errorBox = document.getElementById('errorBox');
      const resultCard = document.getElementById('resultCard');

      errorBox.classList.add('hidden');
      resultCard.classList.add('hidden');
      btn.disabled = true;
      btnText.innerText = 'Processing...';
      btnLoader.style.display = 'block';
      btn.classList.add('opacity-75', 'cursor-not-allowed');

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          // text/plain prevents CORS preflight errors with Google Apps Script
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ originalUrl: url, title: title })
        });
        
        const res = await response.json();
        resetBtnUI();
        
        if (res.success === false) {
           showError(res.message);
        } else {
           const badge = document.getElementById('statusBadge');
           if (res.isDuplicate) {
             badge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20';
             badge.innerText = 'Already Existed';
           } else {
             badge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
             badge.innerText = 'New Link Created';
           }
           
           document.getElementById('shortLink').innerText = res.shortLink;
           document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=${encodeURIComponent(res.shortLink)}`;
           
           resultCard.classList.remove('hidden');
           document.getElementById('qrBox').classList.add('hidden');
           document.getElementById('shortenerForm').classList.add('hidden');
        }
      } catch (err) {
        resetBtnUI();
        showError('Connection Error: Make sure the Google Script is fully deployed and the URL is correct.');
      }
    }

    function resetBtnUI() {
      const btn = document.getElementById('submitBtn');
      document.getElementById('btnText').innerText = 'Shrink URL';
      document.getElementById('btnLoader').style.display = 'none';
      btn.disabled = false;
      btn.classList.remove('opacity-75', 'cursor-not-allowed');
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }

    function copyLink() {
      const text = document.getElementById('shortLink').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        const originalHTML = copyBtn.innerHTML;
        copyBtn.innerHTML = '<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>';
        setTimeout(() => copyBtn.innerHTML = originalHTML, 2000);
      });
    }

    function toggleQR() { document.getElementById('qrBox').classList.toggle('hidden'); }
    
    function resetForm() {
      document.getElementById('shortenerForm').reset();
      document.getElementById('shortenerForm').classList.remove('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('linkTitle').focus();
    }
  </script>
</body>
</html>
