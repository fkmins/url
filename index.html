<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusLink | AI Shortener</title>
  <link rel="icon" href="https://web.dev/static/articles/building/an-adaptive-favicon/image/example-light-theme-favic-d92b9def036e6.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; min-height: 100vh; overflow-y: auto; }
    
    .bg-wolf { position: fixed; inset: 0; z-index: -2; background-image: url('https://img.magnific.com/free-vector/hand-drawn-wolf-head-silhouette_23-2150523847.jpg'); background-size: cover; background-position: center; }
    .bg-overlay { position: fixed; inset: 0; z-index: -1; background-color: rgba(0, 0, 0, 0.75); }

    .snow {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
      background-image: radial-gradient(white, rgba(255,255,255,0) 2px), radial-gradient(white, rgba(255,255,255,0) 1px), radial-gradient(white, rgba(255,255,255,0) 2px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      animation: snow-anim 20s linear infinite;
    }
    @keyframes snow-anim { 0% { background-position: 0px 0px, 0px 0px, 0px 0px; } 100% { background-position: 500px 1000px, 400px 400px, 300px 300px; } }

    .btn-loader { border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast { visibility: hidden; min-width: 250px; background-color: #facc15; color: #000; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 50; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s, bottom 0.3s; font-weight: 900; text-transform: uppercase;}
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
  </style>
</head>
<body class="flex flex-col items-center py-6 px-4">

  <div class="bg-wolf"></div>
  <div class="bg-overlay"></div>
  <div class="snow"></div>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="relative z-10 w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl text-center border-4 border-gray-200 mt-10">
    <h1 class="text-3xl font-extrabold tracking-tight text-yellow-400 border-4 border-black p-3 rounded-xl bg-black mb-6 uppercase inline-block">NexusLink</h1>
    <p class="text-gray-600 font-bold mb-6 text-sm">Enterprise Access Restricted.</p>
    
    <div id="g_id_onload"
         data-client_id="1024803666625-2dsd2ebgn5h4s6pg085bmssbk4kmqdbs.apps.googleusercontent.com" 
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin flex justify-center" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="appScreen" class="relative z-10 w-full max-w-2xl hidden">
    
    <!-- Header Card -->
    <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-gray-200 mb-6 text-center relative max-w-md mx-auto">
      <button onclick="logout()" class="absolute top-4 right-4 text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-red-600 transition-colors">Logout</button>
      
      <h1 class="text-2xl font-extrabold tracking-tight text-yellow-400 border-4 border-black p-2 rounded-xl bg-black mb-6 uppercase shadow-lg inline-block">NexusLink</h1>

      <form id="shortenerForm" onsubmit="event.preventDefault(); handleSubmit();" class="space-y-4 text-center">
        <div>
          <label class="block text-[10px] font-bold text-gray-900 uppercase mb-1">Target URL <span class="text-red-600">*</span></label>
          <input type="url" id="originalUrl" required class="w-full text-center border-2 border-gray-200 rounded-lg px-3 py-2 bg-gray-50 text-black font-medium focus:border-blue-600 focus:bg-white outline-none text-sm" placeholder="https://example.com/long-url">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold text-gray-900 uppercase mb-1">Custom Alias</label>
            <input type="text" id="customAlias" class="w-full text-center border-2 border-gray-200 rounded-lg px-2 py-2 bg-gray-50 text-black font-medium focus:border-blue-600 focus:bg-white outline-none text-sm" placeholder="promo24">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-gray-900 uppercase mb-1">Link Title</label>
            <input type="text" id="linkTitle" class="w-full text-center border-2 border-gray-200 rounded-lg px-2 py-2 bg-gray-50 text-black font-medium focus:border-blue-600 focus:bg-white outline-none text-sm" placeholder="Auto Fetch">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-black hover:bg-yellow-400 hover:text-black border-2 border-black text-white font-black py-3 rounded-xl transition-all flex justify-center items-center gap-2 mt-2 uppercase tracking-widest shadow-lg text-sm">
          <span id="btnText">Generate Link</span>
          <div id="btnLoader" class="btn-loader"></div>
        </button>
      </form>

      <div id="resultCard" class="hidden mt-4 pt-4 border-t-2 border-gray-100 text-center">
        <p id="resultTitle" class="text-[10px] font-bold text-gray-500 uppercase tracking-wide truncate w-full mb-3"></p>
        <div class="bg-yellow-50 border-2 border-yellow-400 rounded-xl p-2 flex flex-col items-center gap-2 mb-3 shadow-sm">
          <input type="text" id="shortLink" readonly class="bg-transparent text-black font-black w-full text-center outline-none cursor-text text-sm truncate">
          <button onclick="copyLink()" class="w-full bg-black text-white font-bold py-2 rounded-lg hover:bg-yellow-400 hover:text-black transition-colors uppercase border-2 border-black text-xs">Copy Link</button>
        </div>
        <button onclick="resetForm()" class="w-full bg-gray-100 hover:bg-gray-200 text-black font-bold py-2 rounded-xl text-xs transition-colors uppercase">Create Another</button>
      </div>
    </div>

    <!-- RECENT LINKS (Grid: stacked on mobile, side-by-side on desktop) -->
    <div class="w-full bg-white/95 p-6 rounded-3xl border-4 border-gray-200 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b-2 border-gray-200 pb-2">
        <h3 class="text-xs font-black text-black uppercase tracking-widest">Recent Links</h3>
        <button onclick="openHistoryModal()" class="text-[10px] bg-black text-white px-3 py-1 rounded-md uppercase font-bold hover:bg-yellow-400 hover:text-black transition-colors">Cloud History</button>
      </div>
      
      <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <!-- FULL HISTORY MODAL -->
  <div id="historyModal" class="fixed inset-0 z-50 bg-black/90 hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-3xl h-[80vh] rounded-3xl border-4 border-yellow-400 p-6 flex flex-col relative shadow-2xl">
      <button onclick="closeHistoryModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-red-500 hover:text-white rounded-full w-8 h-8 font-black transition-colors">X</button>
      <h2 class="text-xl font-black uppercase tracking-widest mb-4">Cloud Database History</h2>
      <input type="text" id="searchInput" onkeyup="filterHistory()" placeholder="Search titles, links, or URLs..." class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 mb-4 outline-none focus:border-black font-medium">
      
      <div id="modalLoader" class="hidden flex-col items-center justify-center h-full">
         <div class="btn-loader border-black border-t-yellow-400 w-10 h-10 border-4 mb-4" style="display:block"></div>
         <p class="font-bold text-gray-500 uppercase tracking-widest text-xs">Fetching Database...</p>
      </div>

      <div id="fullHistoryContainer" class="flex-1 overflow-y-auto space-y-3 pr-2">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <div id="toast">Copied!</div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec'; 
    let currentUserEmail = "";

    window.onload = () => {
      fetch(`${SCRIPT_URL}?action=ping`).catch(()=>'');
      const sessionStr = localStorage.getItem('nexusSession');
      if (sessionStr) {
        const session = JSON.parse(sessionStr);
        if (Date.now() - session.timestamp < 10 * 60 * 1000) {
          currentUserEmail = session.email;
          document.getElementById('authScreen').classList.add('hidden');
          document.getElementById('appScreen').classList.remove('hidden');
          loadHistory();
        } else {
          document.getElementById('authScreen').classList.remove('hidden');
        }
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
      }
    };

    function logout() {
      localStorage.removeItem('nexusSession');
      currentUserEmail = "";
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
    }

    // INSTANT OPTIMISTIC LOGIN
    function handleCredentialResponse(response) {
      let base64 = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      let payload = JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
      
      currentUserEmail = payload.email;
      localStorage.setItem('nexusSession', JSON.stringify({ email: currentUserEmail, timestamp: Date.now() }));
      
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      loadHistory();
    }

    async function handleSubmit() {
      const url = document.getElementById('originalUrl').value.trim();
      const title = document.getElementById('linkTitle').value.trim();
      const alias = document.getElementById('customAlias').value.trim();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');

      errorBox.classList.add('hidden');
      btn.disabled = true; document.getElementById('btnText').innerText = 'Processing...'; document.getElementById('btnLoader').style.display = 'block';

      try {
        const params = new URLSearchParams({ action: 'create', url, title, alias, email: currentUserEmail });
        const response = await fetch(`${SCRIPT_URL}?${params.toString()}`);
        const res = await response.json();
        
        if (!res.success) {
           if(res.message.includes("Unauthorized")) logout(); // Security Catch
           errorBox.innerText = res.message; errorBox.classList.remove('hidden');
        } else {
           localStorage.setItem('nexusSession', JSON.stringify({ email: currentUserEmail, timestamp: Date.now() }));
           document.getElementById('shortLink').value = res.shortLink;
           document.getElementById('resultTitle').innerText = res.title;
           document.getElementById('resultCard').classList.remove('hidden'); 
           document.getElementById('shortenerForm').classList.add('hidden');
           saveToHistory(res.shortLink, res.title);
        }
      } catch (err) {
        errorBox.innerText = 'Network Error. Check console.'; errorBox.classList.remove('hidden');
      } finally {
        btn.disabled = false; document.getElementById('btnText').innerText = 'Generate Link'; document.getElementById('btnLoader').style.display = 'none';
      }
    }

    // CLOUD HISTORY MODAL LOGIC
    async function openHistoryModal() {
      document.getElementById('historyModal').classList.remove('hidden');
      document.getElementById('fullHistoryContainer').innerHTML = "";
      document.getElementById('modalLoader').classList.remove('hidden');
      document.getElementById('modalLoader').classList.add('flex');

      try {
        const response = await fetch(`${SCRIPT_URL}?action=history&email=${encodeURIComponent(currentUserEmail)}`);
        const res = await response.json();
        
        document.getElementById('modalLoader').classList.add('hidden');
        document.getElementById('modalLoader').classList.remove('flex');

        if(res.success) {
          window.fullCloudHistory = res.history;
          renderCloudHistory(res.history);
        } else if (res.message.includes("Unauthorized")) {
          logout();
        }
      } catch(e) {
        document.getElementById('modalLoader').classList.add('hidden');
        document.getElementById('fullHistoryContainer').innerHTML = "<p class='text-center font-bold text-red-500'>Failed to load database.</p>";
      }
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').classList.add('hidden');
    }

    function renderCloudHistory(data) {
      const container = document.getElementById('fullHistoryContainer');
      if (data.length === 0) {
        container.innerHTML = "<p class='text-center text-gray-500 font-bold'>No links found in database.</p>";
        return;
      }
      container.innerHTML = data.map(item => `
        <div class="bg-gray-50 p-4 rounded-xl border-2 border-gray-200 flex justify-between items-center filter-item">
          <div class="overflow-hidden pr-4 w-full">
            <p class="font-bold text-gray-900 text-sm truncate search-target">${item.title}</p>
            <p class="text-[10px] text-gray-400 truncate search-target">${item.source}</p>
            <div class="flex items-center gap-4 mt-1">
              <a href="${item.short}" target="_blank" class="text-xs font-black text-blue-600 truncate hover:underline search-target">${item.short}</a>
              <span class="text-[10px] font-bold text-gray-500 bg-gray-200 px-2 rounded-full">Clicks: ${item.clicks}</span>
            </div>
          </div>
          <button onclick="navigator.clipboard.writeText('${item.short}'); showToast();" class="bg-black text-white px-4 py-2 rounded-lg text-xs font-bold uppercase hover:bg-yellow-400 hover:text-black transition-colors shrink-0">Copy</button>
        </div>
      `).join('');
    }

    function filterHistory() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.filter-item');
      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(query) ? "flex" : "none";
      });
    }

    function resetForm() {
      document.getElementById('shortenerForm').reset();
      document.getElementById('shortenerForm').classList.remove('hidden');
      document.getElementById('resultCard').classList.add('hidden');
    }

    function copyLink() {
      const copyText = document.getElementById('shortLink');
      copyText.select(); navigator.clipboard.writeText(copyText.value); showToast();
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.className = "show"; setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function saveToHistory(shortLink, title) {
      let history = JSON.parse(localStorage.getItem('nexusHistory') || '[]');
      if(!history.find(item => item.short === shortLink)){
        history.unshift({ short: shortLink, title: title || 'Untitled' });
        if(history.length > 5) history.pop();
        localStorage.setItem('nexusHistory', JSON.stringify(history));
      }
      loadHistory();
    }

    function loadHistory() {
      const historyList = document.getElementById('historyList');
      const history = JSON.parse(localStorage.getItem('nexusHistory') || '[]');
      if(history.length === 0) { historyList.innerHTML = '<p class="text-xs text-gray-400 font-bold col-span-full text-center py-4">No recent links.</p>'; return; }

      historyList.innerHTML = history.map(item => `
        <div class="bg-gray-50 p-3 rounded-xl border-2 border-gray-200 flex flex-col items-center text-center">
          <p class="font-bold text-gray-900 text-xs truncate w-full">${item.title}</p>
          <a href="${item.short}" target="_blank" class="text-[10px] font-black text-blue-600 truncate block hover:underline mt-1 w-full">${item.short}</a>
          <button onclick="navigator.clipboard.writeText('${item.short}'); showToast();" class="mt-2 bg-black text-white px-3 py-1 rounded text-[10px] font-bold uppercase hover:bg-yellow-400 hover:text-black transition-colors w-full">Copy</button>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
