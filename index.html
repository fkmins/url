  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec'; 

    async function handleSubmit() {
      const urlInput = document.getElementById('originalUrl');
      const titleInput = document.getElementById('linkTitle');
      
      const url = urlInput ? urlInput.value.trim() : '';
      const title = titleInput ? titleInput.value.trim() : '';
      
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const resultCard = document.getElementById('resultCard');

      // Frontend Safety Check
      if (!url) { 
        errorBox.innerText = "Frontend Error: Please type a URL above.";
        errorBox.classList.remove('hidden');
        return; 
      }

      errorBox.classList.add('hidden'); resultCard.classList.add('hidden');
      btn.disabled = true; document.getElementById('btnText').innerText = 'Processing...';
      document.getElementById('btnLoader').style.display = 'block';

      try {
        const params = new URLSearchParams({
          action: 'create',
          url: url,
          title: title,
          domain: "https://fkmins.github.io/url/"
        });

        const fetchUrl = `${SCRIPT_URL}?${params.toString()}`;
        console.log("Sending request to:", fetchUrl);

        const response = await fetch(fetchUrl);
        const res = await response.json();
        
        btn.disabled = false; document.getElementById('btnText').innerText = 'Generate Link';
        document.getElementById('btnLoader').style.display = 'none';
        
        if (!res.success) {
           errorBox.innerText = res.message; 
           errorBox.classList.remove('hidden');
        } else {
           document.getElementById('shortLink').innerText = res.shortLink;
           resultCard.classList.remove('hidden');
           document.getElementById('shortenerForm').classList.add('hidden');
        }
      } catch (err) {
        btn.disabled = false; document.getElementById('btnText').innerText = 'Generate Link';
        document.getElementById('btnLoader').style.display = 'none';
        errorBox.innerText = 'Network Error. ' + err.message; 
        errorBox.classList.remove('hidden');
      }
    }
