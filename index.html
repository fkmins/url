<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linker Workspace</title>
  <link rel="icon" href="https://files.catbox.moe/dkajo4.png">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; padding: 0; min-height: 100vh; overflow-y: auto; overflow-x: hidden;
    }
    .bg-wolf { position: fixed; inset: 0; z-index: -2; background: url('https://wallpaperaccess.com/full/8532104.jpg') center/cover no-repeat; will-change: transform; }
    .bg-overlay { position: fixed; inset: 0; z-index: -1; background: rgba(0,0,0,.80); }
    .spinner { border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; width: 18px; height: 18px; animation: spin .7s linear infinite; display: none; }
    .spinner-dark { border: 4px solid rgba(0,0,0,.08); border-top-color: #facc15; border-radius: 50%; width: 36px; height: 36px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast {
      visibility: hidden; min-width: 200px; background: #facc15; color: #000; text-align: center;
      border-radius: 10px; padding: 12px 20px; position: fixed; z-index: 100; left: 50%; bottom: 30px;
      transform: translateX(-50%); opacity: 0; transition: opacity .25s, bottom .25s; font-weight: 900;
      text-transform: uppercase; font-size: 12px; box-shadow: 0 4px 20px rgba(250,204,21,.4);
    }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    .pulse-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 0 rgba(34,197,94,.7); animation: pulse 1.6s infinite; }
    .pulse-dot.offline { background: #f59e0b; animation: none; box-shadow: none; }
    @keyframes pulse { 0% { transform: scale(.95); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { transform: scale(.95); } }
    .slim-scroll::-webkit-scrollbar { width: 5px; }
    .slim-scroll::-webkit-scrollbar-track { background: transparent; }
    .slim-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-backdrop.open { display: flex; }
    [data-action]:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen py-8 px-4 dark:text-white">
  <div class="bg-wolf"></div><div class="bg-overlay"></div>

  <!-- Auth Screen -->
  <div id="authScreen" class="relative z-10 w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl p-8 shadow-2xl text-center border-4 border-gray-200 dark:border-gray-700">
    <img src="https://files.catbox.moe/dkajo4.png" class="w-20 h-20 rounded-full border-4 border-black dark:border-gray-600 mb-6 mx-auto object-cover shadow-lg">
    <div id="g_id_onload" data-client_id="1024803666625-2dsd2ebgn5h4s6pg085bmssbk4kmqdbs.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
    <div class="g_id_signin flex justify-center w-full" data-type="standard" data-theme="outline" data-size="large"></div>
    <p id="authStatus" class="mt-5 text-xs text-gray-400 font-bold hidden">Verifying details…</p>
    <p id="authError" class="mt-5 text-xs text-red-500 font-bold hidden"></p>
  </div>

  <!-- Denied Modal -->
  <div id="unauthorizedModal" class="fixed inset-0 z-50 bg-black/95 hidden flex-col items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-white dark:bg-gray-800 max-w-md w-full rounded-3xl border-4 border-red-500 p-8 text-center flex flex-col items-center">
      <h2 class="text-2xl font-black text-red-600 mb-2 uppercase tracking-widest" id="deniedTitle">Access Denied</h2>
      <p class="text-gray-700 dark:text-gray-300 font-bold text-xs" id="deniedText">Not authorized. Contact Admin.</p>
    </div>
  </div>

  <!-- Main App -->
  <div id="appScreen" class="relative z-10 w-full max-w-6xl hidden">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
      
      <!-- Create Panel -->
      <div class="lg:col-span-5 flex flex-col h-full">
        <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-2xl border-4 border-gray-200 dark:border-gray-700 flex-1 flex flex-col items-center relative">
          <button id="logoutBtn" class="absolute top-6 right-6 text-[10px] font-black uppercase text-gray-400 hover:text-red-600">Logout</button>
          <img src="https://files.catbox.moe/dkajo4.png" class="w-16 h-16 rounded-full border-4 border-black dark:border-gray-600 mb-6 object-cover shadow-lg">
          
          <form id="shortenerForm" class="space-y-4 w-full">
            <input type="url" id="originalUrl" required placeholder="Enter URL (Ctrl+N)" class="w-full text-center border-2 border-gray-200 dark:border-gray-600 rounded-xl px-4 py-3 bg-gray-50 dark:bg-gray-700 font-bold focus:border-black outline-none text-xs">
            <div class="grid grid-cols-2 gap-3 w-full">
              <input type="text" id="customAlias" placeholder="Custom Alias" class="w-full text-center border-2 border-gray-200 dark:border-gray-600 rounded-lg px-2 py-2 bg-gray-50 dark:bg-gray-700 focus:border-black outline-none text-xs">
              <input type="text" id="linkTitle" placeholder="Title (optional)" class="w-full text-center border-2 border-gray-200 dark:border-gray-600 rounded-lg px-2 py-2 bg-gray-50 dark:bg-gray-700 focus:border-black outline-none text-xs">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-black dark:bg-yellow-400 hover:bg-yellow-400 dark:text-black text-white hover:text-black font-black py-3.5 rounded-xl flex justify-center items-center gap-2 uppercase text-xs">
              <span id="btnText">Generate Short Url</span><div id="btnLoader" class="spinner"></div>
            </button>
          </form>

          <div id="resultCard" class="hidden mt-4 pt-4 border-t-2 border-gray-100 dark:border-gray-700 w-full flex flex-col items-center">
            <p id="resultTitle" class="text-xs font-black text-gray-700 dark:text-gray-200 uppercase text-center w-full mb-3"></p>
            <div class="bg-yellow-50 dark:bg-gray-700 border-2 border-yellow-400 rounded-xl p-3 flex flex-col gap-2 mb-3 w-full">
              <input type="text" id="shortLink" readonly class="bg-transparent dark:text-white text-black font-black w-full text-center outline-none text-sm">
              <button id="shareLinkBtn" class="w-full bg-black text-white dark:bg-yellow-400 dark:text-black font-bold py-2 rounded-lg hover:bg-yellow-400 hover:text-black uppercase text-xs">Share / Copy</button>
            </div>
            <button id="resetFormBtn" class="w-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-black dark:text-white font-bold py-2 rounded-xl text-xs uppercase">Create Another</button>
          </div>
          <div id="errorBox" class="hidden mt-3 bg-red-100 text-red-900 p-2.5 rounded-xl text-xs font-bold text-center w-full"></div>
        </div>
      </div>

      <!-- History Panel -->
      <div class="lg:col-span-7 flex flex-col h-full">
        <div class="w-full bg-white dark:bg-gray-800 rounded-3xl p-6 border-4 border-gray-200 dark:border-gray-700 shadow-2xl h-full flex flex-col items-center min-h-[500px]">
          <div class="flex items-center justify-center gap-2 bg-green-50 dark:bg-green-900 border border-green-300 dark:border-green-700 px-3 py-1 rounded-full mb-4">
            <span class="pulse-dot" id="syncDot"></span><span class="text-[10px] text-green-800 dark:text-green-200 uppercase font-black">Live</span>
          </div>
          <input type="text" id="searchInput" placeholder="Search links… (Ctrl+K)" class="w-full text-center border-2 border-gray-200 dark:border-gray-600 rounded-xl px-4 py-2.5 mb-4 outline-none focus:border-black font-medium text-xs dark:bg-gray-700">
          
          <div id="listLoader" class="flex-col items-center justify-center flex-1 flex w-full">
            <div class="spinner-dark dark:border-yellow-400 mb-3"></div>
          </div>
          
          <div class="flex-1 overflow-y-auto space-y-4 pr-1 slim-scroll w-full" style="max-height:480px" id="linksScroll">
            <div id="linksContainer" class="hidden space-y-4 w-full"></div>
            <div id="paginationControls" class="hidden w-full flex justify-between items-center py-4 border-t-2 border-gray-100 dark:border-gray-700 mt-4">
              <button id="prevBtn" class="bg-gray-100 dark:bg-gray-700 px-4 py-2 rounded-lg text-xs font-bold uppercase hover:bg-gray-200 disabled:opacity-30">Prev</button>
              <span id="pageInfo" class="text-[10px] font-black text-gray-400 uppercase tracking-widest"></span>
              <button id="nextBtn" class="bg-gray-100 dark:bg-gray-700 px-4 py-2 rounded-lg text-xs font-bold uppercase hover:bg-gray-200 disabled:opacity-30">Next</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-backdrop">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 border-4 border-gray-200 dark:border-gray-700 w-full max-w-md mx-4">
      <h3 class="text-sm font-black uppercase text-center mb-4">Edit Link</h3>
      <input type="hidden" id="editCode">
      <div class="space-y-3">
        <input id="editCodeDisplay" readonly class="w-full text-center border-2 border-gray-100 dark:border-gray-600 rounded-lg px-3 py-2 bg-gray-50 dark:bg-gray-700 text-gray-400 text-xs">
        <input type="url" id="editUrl" class="w-full text-center border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 rounded-lg px-3 py-2 text-xs">
        <input type="text" id="editTitle" class="w-full text-center border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 rounded-lg px-3 py-2 text-xs">
      </div>
      <div id="editErrorBox" class="hidden mt-3 bg-red-100 text-red-900 p-2.5 rounded-xl text-xs font-bold text-center w-full"></div>
      <div class="flex gap-3 mt-5">
        <button id="editCancelBtn" class="flex-1 bg-gray-100 dark:bg-gray-700 py-2.5 rounded-xl text-xs font-bold uppercase">Cancel</button>
        <button id="editSaveBtn" class="flex-1 bg-black text-white dark:bg-yellow-400 dark:text-black py-2.5 rounded-xl text-xs font-bold uppercase flex justify-center gap-2">
          <span id="editSaveText">Save</span><div id="editSaveLoader" class="spinner"></div>
        </button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  'use strict';
  const SCRIPT_URL    = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';
  const DOMAIN        = 'https://fkmins.github.io/url/';
  const SESSION_KEY   = 'linkerSession';
  const SYNC_INTERVAL = 60000;
  
  let currentEmail = '', syncTimer = null, cachedHistory = [];
  let filteredHistory = [], currentPage = 1; 
  const ITEMS_PER_PAGE = 15;

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  // Keyboard Shortcuts
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('searchInput').focus(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); $('originalUrl').focus(); }
    if (e.key === 'Escape' && $('editModal').classList.contains('open')) { closeEditModal(); }
  });

  async function apiGet(params) {
    const qs = new URLSearchParams({ ...params, _ts: Date.now() }).toString();
    const r = await fetch(SCRIPT_URL + '?' + qs, { cache: 'no-store' });
    return await r.json();
  }
  
  async function apiPost(params) {
    const r = await fetch(SCRIPT_URL, { 
      method: 'POST', 
      body: JSON.stringify(params),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    return await r.json();
  }
    
  window.onload = () => {
    const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (sess && Date.now() - sess.ts < 15 * 60 * 1000) {
      currentEmail = sess.email;
      showApp(); syncData();
    } else showAuth();
  };

  document.addEventListener('visibilitychange', () => {
    if (!currentEmail) return;
    document.visibilityState === 'visible' ? syncData() : clearInterval(syncTimer);
  });

  function showAuth() { $('appScreen').classList.add('hidden');$('authScreen').classList.remove('hidden'); }
  function showApp() { 
    $('authScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');
    syncTimer = setInterval(syncData, SYNC_INTERVAL);
  }
  
  function handleCredentialResponse(resp) {
    $('authStatus').classList.remove('hidden');
    $('authError').classList.add('hidden');
    try {
      const base64Url = resp.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const payload = JSON.parse(decodeURIComponent(atob(padded).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
      
      currentEmail = payload.email;
      apiGet({ action: 'history', email: currentEmail }).then(res => {
        if (res.success) {
          localStorage.setItem(SESSION_KEY, JSON.stringify({ email: currentEmail, ts: Date.now() }));
          cachedHistory = res.history; processData(); showApp();
        } else {
          $('authScreen').classList.add('hidden');
          $('unauthorizedModal').classList.remove('hidden');$('unauthorizedModal').classList.add('flex');
        }
      }).catch(err => {
        $('authStatus').classList.add('hidden');
        $('authError').textContent = 'Network error. Please try again.';
        $('authError').classList.remove('hidden');
      });
    } catch(e) {
      $('authStatus').classList.add('hidden');
      $('authError').textContent = 'Authentication error.';
      $('authError').classList.remove('hidden');
    }
  }

  $('logoutBtn').addEventListener('click', logout);
  function logout() { localStorage.removeItem(SESSION_KEY); location.reload(); }

  async function syncData(forceSpinner) {
    if (!currentEmail) return;
    if (forceSpinner) { $('linksContainer').classList.add('hidden');$('listLoader').classList.remove('hidden'); }
    try {
      const res = await apiGet({ action: 'history', email: currentEmail });
      $('syncDot').classList.remove('offline');
      if (res.success) { cachedHistory = res.history; processData(); }
    } catch(e) { $('syncDot').classList.add('offline'); }
  }

  $('shortenerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = $('originalUrl').value.trim();
    const title = $('linkTitle').value.trim();
    const alias = $('customAlias').value.trim();
    if (!url) return;
    
    $('errorBox').classList.add('hidden');
    $('submitBtn').disabled = true; $('btnText').textContent = 'Wait…';$('btnLoader').style.display = 'block';
    
    // Optimistic UI update
    const optimisticItem = { title: title || 'Generating...', source: url, shortCode: alias || '⏳', shortLink: '...', clicks: 0 };
    cachedHistory.unshift(optimisticItem);
    processData();

    const params = { action: 'create', email: currentEmail, url: url, title: title, alias: alias, domain: DOMAIN };
    
    try {
      const res = await apiPost(params);
      if (res.success) {
        $('shortLink').value = res.shortLink; $('resultTitle').textContent = res.title;
        $('shortenerForm').classList.add('hidden');$('resultCard').classList.remove('hidden');
        syncData(true);
      } else {
        cachedHistory.shift(); processData();
        $('errorBox').textContent = res.message; $('errorBox').classList.remove('hidden');
      }
    } catch (err) {
      cachedHistory.shift(); processData();
      $('errorBox').textContent = 'Network error. Failed to create link.'; $('errorBox').classList.remove('hidden');
    } finally {
      $('submitBtn').disabled = false; $('btnText').textContent = 'Generate Short Url';$('btnLoader').style.display = 'none';
    }
  });

  async function deleteLink(code) {
    if (!confirm(`Delete /${code}?`)) return;
    const idx = cachedHistory.findIndex(h => h.shortCode === code);
    const backup = cachedHistory[idx];
    if (idx > -1) { cachedHistory.splice(idx, 1); processData(); }
    
    try {
      const r = await apiPost({ action: 'delete', email: currentEmail, code: code });
      if (!r.success) throw new Error();
      syncData(true);
    } catch(e) {
      if (idx > -1) { cachedHistory.splice(idx, 0, backup); processData(); }
      showToast('Delete failed');
    }
  }

  function openEditModal(code, url, title) {
    $('editCode').value = code; $('editCodeDisplay').value = '/' + code;
    $('editUrl').value = url; $('editTitle').value = title;
    $('editErrorBox').classList.add('hidden');
    $('editModal').classList.add('open');
  }
  
  $('editCancelBtn').addEventListener('click', closeEditModal);
  function closeEditModal() { $('editModal').classList.remove('open'); }

  $('editSaveBtn').addEventListener('click', async () => {
    $('editSaveBtn').disabled = true; $('editSaveText').textContent = 'Saving...'; $('editSaveLoader').style.display = 'block';
    $('editErrorBox').classList.add('hidden');
    try {
      const res = await apiPost({ action: 'update', email: currentEmail, code: $('editCode').value, url:$('editUrl').value.trim(), title: $('editTitle').value.trim() });
      if (res.success) {
        closeEditModal(); syncData(true);
      } else {
        $('editErrorBox').textContent = res.message; $('editErrorBox').classList.remove('hidden');
      }
    } catch(e) {
      $('editErrorBox').textContent = 'Network error.'; $('editErrorBox').classList.remove('hidden');
    } finally {
      $('editSaveBtn').disabled = false; $('editSaveText').textContent = 'Save'; $('editSaveLoader').style.display = 'none';
    }
  });

  let searchTimeout;
  $('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => { currentPage = 1; processData(); }, 300);
  });

  function processData() {
    const q = $('searchInput').value.toLowerCase();
    filteredHistory = q ? cachedHistory.filter(h => h.title.toLowerCase().includes(q) || h.source.toLowerCase().includes(q) || h.shortCode.toLowerCase().includes(q)) : cachedHistory;
    renderPage();
  }

  function renderPage() {
    $('listLoader').classList.add('hidden');$('linksContainer').classList.remove('hidden');
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const end = start + ITEMS_PER_PAGE;
    const pageData = filteredHistory.slice(start, end);
    const maxClicks = Math.max(1, ...cachedHistory.map(h => h.clicks || 0));

    if (pageData.length > 0) {
      $('linksContainer').innerHTML = pageData.map(h => 
        `<div class="relative overflow-hidden bg-gray-50 dark:bg-gray-800 p-5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 shadow-sm text-center">
           <div class="absolute bottom-0 left-0 h-1 bg-green-400 dark:bg-green-600 opacity-70" style="width:${(h.clicks / maxClicks) * 100}%"></div>
           <p class="font-black text-sm truncate w-full max-w-[300px] mx-auto">${esc(h.title)}</p>
           <p class="text-[10px] text-gray-400 truncate mb-2 w-full max-w-[300px] mx-auto">${esc(h.source)}</p>
           <a href="${esc(h.shortLink)}" target="_blank" class="text-xs font-black text-blue-600 dark:text-blue-400 block mb-2">${esc(h.shortLink)} <span class="text-gray-500 text-[10px]">(${h.clicks || 0} clicks)</span></a>
           <div class="flex gap-2 justify-center mt-3 relative z-10">
             <button data-action="share" data-link="${esc(h.shortLink)}" class="bg-black text-white dark:bg-gray-600 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase hover:bg-yellow-400 hover:text-black">Copy</button>
             <button data-action="edit" data-code="${h.shortCode}" data-url="${esc(h.source)}" data-title="${esc(h.title)}" class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">Edit</button>
             <button data-action="delete" data-code="${h.shortCode}" class="bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">Del</button>
           </div>
         </div>`
      ).join('');
    } else {
      $('linksContainer').innerHTML = `<div class="py-8 flex flex-col items-center">
        <p class="text-xs font-bold text-gray-400 text-center mb-4">No links found.</p>
        <button data-action="focus-new" class="bg-black text-white dark:bg-yellow-400 dark:text-black font-bold py-2 px-4 rounded-xl text-xs uppercase hover:opacity-80">Create a Link</button>
      </div>`;
    }

    if (filteredHistory.length > ITEMS_PER_PAGE) {
      $('paginationControls').classList.remove('hidden');
      $('paginationControls').classList.add('flex');$('pageInfo').textContent = `Page ${currentPage} of ${Math.ceil(filteredHistory.length / ITEMS_PER_PAGE)}`;
      $('prevBtn').disabled = currentPage === 1;
      $('nextBtn').disabled = end >= filteredHistory.length;
    } else {
      $('paginationControls').classList.add('hidden');
    }
  }

  // Event Delegation for History List
  $('linksContainer').addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    if (action === 'share') handleShare(btn.getAttribute('data-link'));
    if (action === 'edit') openEditModal(btn.getAttribute('data-code'), btn.getAttribute('data-url'), btn.getAttribute('data-title'));
    if (action === 'delete') deleteLink(btn.getAttribute('data-code'));
    if (action === 'focus-new') { $('originalUrl').focus(); window.scrollTo(0,0); }
  });

  $('prevBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); $('linksScroll').scrollTop = 0; } });
  $('nextBtn').addEventListener('click', () => { if ((currentPage * ITEMS_PER_PAGE) < filteredHistory.length) { currentPage++; renderPage(); $('linksScroll').scrollTop = 0; } });
  
  $('resetFormBtn').addEventListener('click', () => { 
    $('shortenerForm').reset();
    $('shortenerForm').classList.remove('hidden'); 
    $('resultCard').classList.add('hidden');
    $('originalUrl').focus(); 
  });
  
  $('shareLinkBtn').addEventListener('click', () => handleShare($('shortLink').value));

  async function handleShare(link) {
    if (navigator.share && window.matchMedia('(pointer: coarse)').matches) {
      try { await navigator.share({ title: 'Short Link', url: link }); return; } catch(e){}
    }
    copyToClipboard(link);
  }

  function copyToClipboard(txt) { 
    navigator.clipboard.writeText(txt); 
    showToast('Link Copied'); 
  }
  
  function showToast(msg) {
    const t = $('toast'); 
    t.textContent = msg;
    t.classList.add('show'); 
    setTimeout(() => t.classList.remove('show'), 2000);
  }
  </script>
</body>
</html>
