<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusLink | AI Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; background-color: #f8fafc; }
    .btn-loader { border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">
  <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl border border-gray-100 mb-8">
    
    <div class="mb-8 border-b-4 border-black pb-4">
      <h1 class="text-3xl font-extrabold tracking-tight"><span class="text-red-600">Nexus</span>Link</h1>
      <p class="text-gray-500 font-semibold text-sm mt-1">Smart Enterprise Routing</p>
    </div>

    <form id="shortenerForm" onsubmit="event.preventDefault(); handleSubmit();" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-900 uppercase mb-2">Target URL <span class="text-red-600">*</span></label>
        <input type="url" id="originalUrl" required class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 bg-gray-50 text-black font-medium focus:border-blue-600 focus:bg-white transition-all outline-none" placeholder="https://example.com/long-url">
      </div>
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-900 uppercase mb-2">Custom Alias</label>
          <input type="text" id="customAlias" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 bg-gray-50 text-black font-medium focus:border-blue-600 focus:bg-white transition-all outline-none" placeholder="e.g. promo24">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-900 uppercase mb-2">Link Title <span class="text-blue-600 lowercase font-semibold">(Auto)</span></label>
          <input type="text" id="linkTitle" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 bg-gray-50 text-black font-medium focus:border-blue-600 focus:bg-white transition-all outline-none" placeholder="Smart Agent...">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-black hover:bg-red-600 text-white font-bold py-4 rounded-xl transition-all flex justify-center items-center gap-2 mt-4">
        <span id="btnText">Generate Link</span>
        <div id="btnLoader" class="btn-loader"></div>
      </button>
    </form>

    <div id="resultCard" class="hidden mt-6 pt-6 border-t-2 border-gray-100">
      
      <!-- QR Code Display -->
      <div class="flex flex-col items-center justify-center mb-5">
        <img id="qrCode" src="" alt="QR Code" class="w-32 h-32 border-2 border-gray-200 rounded-lg p-1 mb-2">
        <p id="resultTitle" class="text-xs font-bold text-gray-500 uppercase tracking-wide truncate w-full text-center"></p>
      </div>

      <div class="bg-blue-50 border-2 border-blue-100 rounded-xl p-3 flex items-center justify-between gap-3 mb-4">
        <input type="text" id="shortLink" readonly class="bg-transparent text-blue-700 font-bold w-full px-2 outline-none cursor-text text-lg truncate">
        <button onclick="copyLink()" id="copyBtn" class="shrink-0 bg-blue-600 hover:bg-black p-3 rounded-lg text-white font-bold transition-colors">Copy</button>
      </div>
      <button onclick="resetForm()" class="w-full bg-gray-100 hover:bg-gray-200 text-black font-bold py-3 rounded-xl text-sm transition-colors">Create Another</button>
    </div>
    
    <div id="errorBox" class="hidden mt-4 bg-red-100 text-red-900 p-3 rounded-lg text-sm font-bold text-center border-2 border-red-200"></div>
  </div>

  <!-- Local History -->
  <div class="w-full max-w-md">
    <h3 class="text-xs font-bold text-gray-500 uppercase mb-3 pl-1">Your Recent Links</h3>
    <div id="historyList" class="space-y-3">
      <!-- Injected via JS -->
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec'; 

    document.addEventListener("DOMContentLoaded", loadHistory);

    async function handleSubmit() {
      const url = document.getElementById('originalUrl').value.trim();
      const title = document.getElementById('linkTitle').value.trim();
      const alias = document.getElementById('customAlias').value.trim();
      
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const resultCard = document.getElementById('resultCard');

      errorBox.classList.add('hidden');
      btn.disabled = true; 
      document.getElementById('btnText').innerText = 'Processing...';
      document.getElementById('btnLoader').style.display = 'block';

      try {
        const params = new URLSearchParams({
          action: 'create', url: url, title: title, alias: alias, domain: "https://fkmins.github.io/url/"
        });

        const response = await fetch(`${SCRIPT_URL}?${params.toString()}`);
        const res = await response.json();
        
        btn.disabled = false; 
        document.getElementById('btnText').innerText = 'Generate Link';
        document.getElementById('btnLoader').style.display = 'none';
        
        if (!res.success) {
           errorBox.innerText = res.message; 
           errorBox.classList.remove('hidden');
        } else {
           document.getElementById('shortLink').value = res.shortLink;
           document.getElementById('resultTitle').innerText = res.title;
           document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(res.shortLink)}`;
           
           resultCard.classList.remove('hidden');
           document.getElementById('shortenerForm').classList.add('hidden');
           saveToHistory(res.shortLink, res.title, url);
        }
      } catch (err) {
        btn.disabled = false; 
        document.getElementById('btnText').innerText = 'Generate Link';
        document.getElementById('btnLoader').style.display = 'none';
        errorBox.innerText = 'Network Error. Check console.'; 
        errorBox.classList.remove('hidden');
      }
    }

    function resetForm() {
      document.getElementById('shortenerForm').reset();
      document.getElementById('shortenerForm').classList.remove('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('copyBtn').innerText = 'Copy';
    }

    function copyLink() {
      const copyText = document.getElementById('shortLink');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      document.getElementById('copyBtn').innerText = 'Copied!';
    }

    function saveToHistory(shortLink, title, targetUrl) {
      let history = JSON.parse(localStorage.getItem('nexusHistory') || '[]');
      if(!history.find(item => item.short === shortLink)){
        history.unshift({ short: shortLink, title: title || 'Untitled', original: targetUrl });
        if(history.length > 5) history.pop();
        localStorage.setItem('nexusHistory', JSON.stringify(history));
      }
      loadHistory();
    }

    function loadHistory() {
      const historyList = document.getElementById('historyList');
      const history = JSON.parse(localStorage.getItem('nexusHistory') || '[]');
      
      if(history.length === 0) {
        historyList.innerHTML = '<p class="text-sm text-gray-400 font-semibold mt-2">No links created yet.</p>';
        return;
      }

      historyList.innerHTML = history.map(item => `
        <div class="bg-white p-4 rounded-xl border-2 border-gray-200 flex justify-between items-center">
          <div class="overflow-hidden pr-3">
            <p class="font-bold text-gray-900 text-sm truncate">${item.title}</p>
            <a href="${item.short}" target="_blank" class="text-xs font-semibold text-blue-600 truncate block hover:underline mt-1">${item.short}</a>
          </div>
          <button onclick="navigator.clipboard.writeText('${item.short}'); alert('Copied to clipboard!')" class="text-gray-400 hover:text-black shrink-0 font-bold text-xs uppercase">
            Copy
          </button>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
