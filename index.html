<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusLink | Enterprise Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #000000; }
    .smart-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); }
    .input-focus:focus-within { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    
    .loader {
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  
  <div class="bg-white rounded-2xl p-8 w-full max-w-md smart-shadow border border-gray-100">
    <div class="mb-8">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 bg-black text-white rounded-lg flex items-center justify-center font-bold text-xl">
          N
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight">NexusLink</h1>
      </div>
      <p class="text-gray-500 text-sm font-medium">Smart URL Shortener & Manager</p>
    </div>

    <form id="shortenerForm" onsubmit="event.preventDefault(); handleSubmit();" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-900 uppercase tracking-wider mb-2">Target URL <span class="text-red-500">*</span></label>
        <div class="border-2 border-gray-200 rounded-xl px-4 py-3 bg-gray-50 transition-all input-focus">
          <input type="url" id="originalUrl" required class="w-full bg-transparent text-black placeholder-gray-400 focus:outline-none font-medium" placeholder="https://example.com/long-url">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-900 uppercase tracking-wider mb-2">Link Title <span class="text-gray-400 font-normal lowercase">(Auto-fetches if empty)</span></label>
        <div class="border-2 border-gray-200 rounded-xl px-4 py-3 bg-gray-50 transition-all input-focus">
          <input type="text" id="linkTitle" class="w-full bg-transparent text-black placeholder-gray-400 focus:outline-none font-medium" placeholder="Leave blank for smart-title">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-colors flex justify-center items-center gap-2 mt-4">
        <span id="btnText">Generate Short Link</span>
        <div id="btnLoader" class="loader"></div>
      </button>
    </form>

    <div id="resultCard" class="hidden mt-6 pt-6 border-t border-gray-100 transition-all">
      <div class="flex items-center justify-between mb-4">
        <span class="text-sm font-bold text-gray-900 uppercase tracking-wide">Result</span>
        <span id="statusBadge" class="text-xs font-bold px-3 py-1 rounded-md"></span>
      </div>
      
      <div class="bg-gray-50 border-2 border-gray-200 rounded-xl p-3 flex items-center justify-between gap-3 mb-4">
        <div id="shortLink" class="text-blue-600 font-bold truncate select-all px-2"></div>
        <button onclick="copyLink()" id="copyBtn" class="shrink-0 bg-black hover:bg-gray-800 p-2.5 rounded-lg text-white transition-colors" title="Copy to clipboard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        </button>
      </div>

      <div class="flex gap-3">
        <button onclick="toggleQR()" class="flex-1 bg-white hover:bg-gray-50 border-2 border-gray-200 text-black font-bold py-3 rounded-xl transition-all text-sm">
          Show QR Code
        </button>
        <button onclick="resetForm()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-black font-bold py-3 rounded-xl transition-all text-sm">
          Create Another
        </button>
      </div>

      <div id="qrBox" class="hidden mt-4 text-center">
        <div class="bg-white p-4 rounded-xl border-2 border-gray-200 inline-block">
          <img id="qrImage" src="" alt="QR Code" class="w-40 h-40">
        </div>
      </div>
    </div>
    
    <div id="errorBox" class="hidden mt-5 bg-red-50 border-l-4 border-red-600 text-red-900 p-4 rounded-r-lg text-sm font-medium"></div>
  </div>

  <script>
    // URL has been updated to yours automatically
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLpxVbeA9Tk9NZW1e8Z8W8vVwamoScteknqh3JPX3Yo1I93je5K4WwsjM7fuFzxf7S/exec'; 

    async function handleSubmit() {
      const title = document.getElementById('linkTitle').value;
      const url = document.getElementById('originalUrl').value;
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnLoader = document.getElementById('btnLoader');
      const errorBox = document.getElementById('errorBox');
      const resultCard = document.getElementById('resultCard');

      errorBox.classList.add('hidden');
      resultCard.classList.add('hidden');
      btn.disabled = true;
      btnText.innerText = title ? 'Generating...' : 'Scraping Smart Title...';
      btnLoader.style.display = 'block';
      btn.classList.add('opacity-70', 'cursor-not-allowed');

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ originalUrl: url, title: title })
        });
        
        // Check if Google sent back an HTML login page instead of JSON
        const contentType = response.headers.get("content-type");
        if (contentType && contentType.indexOf("text/html") !== -1) {
          throw new Error("Permissions Error: Ensure the script is deployed to execute as 'Me' and accessible by 'Anyone'.");
        }

        const res = await response.json();
        resetBtnUI();
        
        if (res.success === false) {
           showError(res.message);
        } else {
           const badge = document.getElementById('statusBadge');
           if (res.isDuplicate) {
             badge.className = 'text-xs font-bold px-3 py-1 rounded-md bg-black text-white';
             badge.innerText = 'Existing Match';
           } else {
             badge.className = 'text-xs font-bold px-3 py-1 rounded-md bg-blue-100 text-blue-700';
             badge.innerText = 'New Link';
           }
           
           document.getElementById('shortLink').innerText = res.shortLink;
           document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=${encodeURIComponent(res.shortLink)}`;
           
           resultCard.classList.remove('hidden');
           document.getElementById('qrBox').classList.add('hidden');
           document.getElementById('shortenerForm').classList.add('hidden');
        }
      } catch (err) {
        resetBtnUI();
        showError(err.message.includes('Permissions') ? err.message : 'Network Error: Failed to connect to the Google backend.');
      }
    }

    function resetBtnUI() {
      const btn = document.getElementById('submitBtn');
      document.getElementById('btnText').innerText = 'Generate Short Link';
      document.getElementById('btnLoader').style.display = 'none';
      btn.disabled = false;
      btn.classList.remove('opacity-70', 'cursor-not-allowed');
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerHTML = `<strong>Error:</strong> ${msg}`;
      errorBox.classList.remove('hidden');
    }

    function copyLink() {
      const text = document.getElementById('shortLink').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        const originalHTML = copyBtn.innerHTML;
        copyBtn.innerHTML = '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>';
        copyBtn.classList.replace('bg-black', 'bg-blue-600');
        setTimeout(() => {
          copyBtn.innerHTML = originalHTML;
          copyBtn.classList.replace('bg-blue-600', 'bg-black');
        }, 2000);
      });
    }

    function toggleQR() { document.getElementById('qrBox').classList.toggle('hidden'); }
    
    function resetForm() {
      document.getElementById('shortenerForm').reset();
      document.getElementById('shortenerForm').classList.remove('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('originalUrl').focus();
    }
  </script>
</body>
</html>
