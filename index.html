<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linker | Workspace</title>
  <link rel="icon" href="https://files.catbox.moe/dkajo4.png">
  <meta name="description" content="Linker — Private URL Shortener Workspace">
  <meta property="og:title" content="Linker">
  <meta property="og:image" content="https://files.catbox.moe/dkajo4.png">

  <!-- Tailwind CSS v3 (standalone build — no Play CDN overhead) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0; padding: 0;
      min-height: 100vh;
      overflow-y: auto; overflow-x: hidden;
    }

    /* ── Backgrounds ───────────────────────────────────────────────────── */
    .bg-wolf    { position: fixed; inset: 0; z-index: -2;
                  background: url('https://wallpaperaccess.com/full/8532104.jpg') center/cover no-repeat; }
    .bg-overlay { position: fixed; inset: 0; z-index: -1;
                  background: rgba(0,0,0,.80); }

    /* ── Snow ──────────────────────────────────────────────────────────── */
    .snow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(white, rgba(255,255,255,0) 2px),
        radial-gradient(white, rgba(255,255,255,0) 1px),
        radial-gradient(white, rgba(255,255,255,0) 2px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      animation: snow 20s linear infinite;
    }
    @keyframes snow {
      to { background-position: 500px 1000px, 400px 400px, 300px 300px; }
    }

    /* ── Spinner ───────────────────────────────────────────────────────── */
    .spinner {
      border: 3px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; width: 18px; height: 18px;
      animation: spin .7s linear infinite; display: none;
    }
    .spinner-dark {
      border: 4px solid rgba(0,0,0,.08); border-top-color: #facc15;
      border-radius: 50%; width: 36px; height: 36px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ─────────────────────────────────────────────────────────── */
    #toast {
      visibility: hidden; min-width: 200px;
      background: #facc15; color: #000; text-align: center;
      border-radius: 10px; padding: 12px 20px;
      position: fixed; z-index: 100; left: 50%; bottom: 30px;
      transform: translateX(-50%); opacity: 0;
      transition: opacity .25s, bottom .25s;
      font-weight: 900; text-transform: uppercase; font-size: 12px;
      box-shadow: 0 4px 20px rgba(250,204,21,.4);
    }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

    /* ── Pulse dot ─────────────────────────────────────────────────────── */
    .pulse-dot {
      width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(34,197,94,.7);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(.95); box-shadow: 0 0 0 0   rgba(34,197,94,.7); }
      70%  { transform: scale(1);   box-shadow: 0 0 0 8px rgba(34,197,94,0);  }
      100% { transform: scale(.95); box-shadow: 0 0 0 0   rgba(34,197,94,0);  }
    }

    /* ── Scrollbar ─────────────────────────────────────────────────────── */
    .slim-scroll::-webkit-scrollbar       { width: 5px; }
    .slim-scroll::-webkit-scrollbar-track { background: transparent; }
    .slim-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

    /* ── Item animation ────────────────────────────────────────────────── */
    .item-enter { animation: item-in .25s ease; }
    @keyframes item-in { from { opacity: 0; transform: translateY(-8px); } }

    /* ── Edit modal ────────────────────────────────────────────────────── */
    .modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6);
                      display: none; align-items: center; justify-content: center;
                      backdrop-filter: blur(4px); }
    .modal-backdrop.open { display: flex; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen py-8 px-4">

  <div class="bg-wolf"></div>
  <div class="bg-overlay"></div>
  <div class="snow"></div>

  <!-- ╔═══════════════════════════════════════╗
       ║         1. AUTH SCREEN                ║
       ╚═══════════════════════════════════════╝ -->
  <div id="authScreen" class="relative z-10 w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl text-center border-4 border-gray-200">
    <div class="flex flex-col items-center mb-8">
      <img src="https://files.catbox.moe/dkajo4.png" alt="Linker"
           class="w-20 h-20 rounded-full border-4 border-black mb-4 object-cover shadow-lg bg-white">
    </div>

    <div id="g_id_onload"
         data-client_id="1024803666625-2dsd2ebgn5h4s6pg085bmssbk4kmqdbs.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false"></div>
    <div class="g_id_signin flex justify-center w-full"
         data-type="standard" data-shape="rectangular"
         data-theme="outline"  data-text="signin_with"
         data-size="large"     data-logo_alignment="left"></div>

    <p id="authStatus" class="mt-5 text-xs text-gray-400 font-bold hidden">Verifying access…</p>
  </div>

  <!-- ╔═══════════════════════════════════════╗
       ║       2. ACCESS DENIED MODAL          ║
       ╚═══════════════════════════════════════╝ -->
  <div id="unauthorizedModal"
       class="fixed inset-0 z-50 bg-black/95 hidden flex-col items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-white max-w-md w-full rounded-3xl border-4 border-red-500 p-8 text-center
                shadow-[0_0_50px_rgba(239,68,68,.5)] flex flex-col items-center">
      <svg class="w-16 h-16 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <h2 class="text-2xl font-black text-red-600 mb-2 uppercase tracking-widest">Access Denied</h2>
      <p class="text-gray-700 font-bold text-xs leading-relaxed">
        You are not authorized to use this site.<br>Please contact <strong>dhrubajyotid1.vc</strong>
      </p>
    </div>
  </div>

  <!-- ╔═══════════════════════════════════════╗
       ║          3. APP SCREEN                ║
       ╚═══════════════════════════════════════╝ -->
  <div id="appScreen" class="relative z-10 w-full max-w-6xl hidden">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">

      <!-- ── LEFT: Generator ────────────────────────────────────────────── -->
      <div class="lg:col-span-5 flex flex-col h-full">
        <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-gray-200
                    flex-1 flex flex-col items-center">

          <div class="flex flex-col items-center mb-6 relative w-full text-center">
            <button onclick="logout()"
                    class="absolute top-0 right-0 text-[10px] font-black uppercase tracking-widest
                           text-gray-400 hover:text-red-600 transition-colors">Logout</button>
            <img src="https://files.catbox.moe/dkajo4.png" alt="Linker"
                 class="w-16 h-16 rounded-full border-4 border-black mb-3 object-cover shadow-lg bg-white">
          </div>

          <!-- Shortener form -->
          <form id="shortenerForm" onsubmit="event.preventDefault(); handleSubmit();"
                class="space-y-4 w-full flex flex-col items-center">
            <input type="url" id="originalUrl" required placeholder="Enter URL"
                   class="w-full text-center border-2 border-gray-200 rounded-xl px-4 py-3
                          bg-gray-50 text-black font-bold focus:border-black focus:bg-white
                          outline-none text-xs transition-all">

            <div class="grid grid-cols-2 gap-3 w-full">
              <div class="flex flex-col items-center">
                <label class="block text-[10px] font-bold text-gray-900 uppercase mb-1">Custom Alias</label>
                <input type="text" id="customAlias" placeholder="E.g. poster"
                       class="w-full text-center border-2 border-gray-200 rounded-lg px-2 py-2
                              bg-gray-50 text-black font-medium focus:border-black focus:bg-white
                              outline-none text-xs">
              </div>
              <div class="flex flex-col items-center">
                <label class="block text-[10px] font-bold text-gray-900 uppercase mb-1">Link Title</label>
                <input type="text" id="linkTitle" placeholder="E.g. Poster Folder"
                       class="w-full text-center border-2 border-gray-200 rounded-lg px-2 py-2
                              bg-gray-50 text-black font-medium focus:border-black focus:bg-white
                              outline-none text-xs">
              </div>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full bg-black hover:bg-yellow-400 hover:text-black border-2 border-black
                           text-white font-black py-3.5 rounded-xl transition-all flex justify-center
                           items-center gap-2 uppercase tracking-widest shadow-md text-xs">
              <span id="btnText">Generate a Short Url</span>
              <div id="btnLoader" class="spinner"></div>
            </button>
          </form>

          <!-- Result card (shown after successful creation) -->
          <div id="resultCard" class="hidden mt-4 pt-4 border-t-2 border-gray-100 w-full flex flex-col items-center">
            <p id="resultTitle" class="text-xs font-black text-gray-700 uppercase tracking-wide
                                       text-center truncate w-full mb-3"></p>
            <p id="resultDupNote" class="hidden text-[10px] font-bold text-amber-600 mb-2 text-center"></p>
            <div class="bg-yellow-50 border-2 border-yellow-400 rounded-xl p-3
                        flex flex-col items-center gap-2 mb-3 shadow-sm w-full">
              <input type="text" id="shortLink" readonly
                     class="bg-transparent text-black font-black w-full text-center
                            outline-none cursor-text text-sm truncate">
              <button onclick="copyLink()"
                      class="w-full bg-black text-white font-bold py-2 rounded-lg
                             hover:bg-yellow-400 hover:text-black transition-colors
                             uppercase border-2 border-black text-xs tracking-widest shadow-sm">
                Copy Link
              </button>
            </div>
            <button onclick="resetForm()"
                    class="w-full bg-gray-100 hover:bg-gray-200 text-black font-bold py-2
                           rounded-xl text-xs transition-colors uppercase tracking-widest">
              Create Another
            </button>
          </div>

          <!-- Error box -->
          <div id="errorBox"
               class="hidden mt-3 bg-red-100 text-red-900 p-2.5 rounded-xl text-xs
                      font-bold text-center border-2 border-red-200 w-full"></div>
        </div>
      </div>

      <!-- ── RIGHT: Links List ──────────────────────────────────────────── -->
      <div class="lg:col-span-7 flex flex-col h-full">
        <div class="w-full bg-white rounded-3xl p-6 border-4 border-gray-200 shadow-2xl
                    h-full flex flex-col items-center min-h-[500px]">

          <div class="flex flex-col items-center mb-4 pb-4 border-b-2 border-gray-100 w-full text-center">
            <div class="flex items-center justify-center gap-2 bg-green-50
                        border border-green-300 px-3 py-1 rounded-full">
              <span class="pulse-dot"></span>
              <span class="text-[10px] text-green-800 uppercase font-black">All Links</span>
              <span id="lastSyncedLabel" class="text-[9px] text-green-700 font-bold ml-1"></span>
            </div>
          </div>

          <input type="text" id="searchInput" oninput="filterHistory()" placeholder="Search links…"
                 class="w-full text-center border-2 border-gray-200 rounded-xl px-4 py-2.5
                        mb-4 outline-none focus:border-black font-medium text-xs
                        transition-all shadow-inner">

          <!-- Loader -->
          <div id="listLoader" class="flex-col items-center justify-center flex-1 flex my-8 w-full text-center">
            <div class="spinner-dark mb-3"></div>
            <p class="font-bold text-gray-400 uppercase tracking-widest text-[10px]">Syncing database…</p>
          </div>

          <!-- Links container -->
          <div id="linksContainer"
               class="flex-1 overflow-y-auto space-y-4 pr-1 slim-scroll w-full hidden"
               style="max-height:480px"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ╔═══════════════════════════════════════╗
       ║       4. EDIT MODAL                   ║
       ╚═══════════════════════════════════════╝ -->
  <div id="editModal" class="modal-backdrop">
    <div class="bg-white rounded-3xl p-6 border-4 border-gray-200 shadow-2xl
                w-full max-w-md mx-4 flex flex-col items-center">
      <h3 class="text-sm font-black uppercase tracking-widest mb-4 text-gray-900">Edit Link</h3>
      <input type="hidden" id="editCode">
      <div class="w-full space-y-3">
        <div>
          <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Short Code</label>
          <input id="editCodeDisplay" readonly
                 class="w-full text-center border-2 border-gray-100 rounded-lg px-3 py-2
                        bg-gray-50 text-gray-400 font-bold text-xs cursor-not-allowed">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">New Destination URL</label>
          <input type="url" id="editUrl"
                 class="w-full text-center border-2 border-gray-200 rounded-lg px-3 py-2
                        bg-gray-50 text-black font-medium focus:border-black focus:bg-white
                        outline-none text-xs transition-all">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Title (optional)</label>
          <input type="text" id="editTitle"
                 class="w-full text-center border-2 border-gray-200 rounded-lg px-3 py-2
                        bg-gray-50 text-black font-medium focus:border-black focus:bg-white
                        outline-none text-xs transition-all">
        </div>
      </div>
      <div id="editError" class="hidden mt-3 text-xs font-bold text-red-600 text-center w-full"></div>
      <div class="flex gap-3 mt-5 w-full">
        <button onclick="closeEditModal()"
                class="flex-1 bg-gray-100 hover:bg-gray-200 text-black font-bold py-2.5
                       rounded-xl text-xs uppercase tracking-widest transition-colors">Cancel</button>
        <button onclick="submitEdit()" id="editSaveBtn"
                class="flex-1 bg-black hover:bg-yellow-400 hover:text-black text-white font-bold
                       py-2.5 rounded-xl text-xs uppercase tracking-widest transition-colors
                       flex items-center justify-center gap-2">
          <span id="editSaveText">Save</span>
          <div id="editSaveLoader" class="spinner"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast">Link Copied</div>

  <!-- ╔═══════════════════════════════════════╗
       ║          JAVASCRIPT                   ║
       ╚═══════════════════════════════════════╝ -->
  <script>
  'use strict';

  /* ── Config ──────────────────────────────────────────────────────────── */
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';
  const DOMAIN     = 'https://fkmins.github.io/url/';
  const SESSION_KEY = 'linkerSession';
  const HISTORY_KEY = 'linkerHistory';
  const SESSION_TTL = 15 * 60 * 1000;  // 15 min

  /* ── State ───────────────────────────────────────────────────────────── */
  let currentEmail  = '';
  let syncTimer     = null;
  let isMutating    = false;
  let syncSeq       = 0;        // prevents stale sync responses from overwriting newer data
  let cachedHistory = [];

  /* ── DOM helpers ─────────────────────────────────────────────────────── */
  const $  = id => document.getElementById(id);

  /** Escape user strings before injecting into HTML */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ── API (GET only — GAS 302 redirect kills POST body) ───────────────── */
  function api(params) {
    const qs = new URLSearchParams({ ...params, _ts: Date.now() }).toString();
    return fetch(SCRIPT_URL + '?' + qs, { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .catch(() => ({ success: false, message: 'Network error — check your connection.' }));
  }

  /* ══════════════════════════════════════════════════════════════════════
   *  BOOT
   * ══════════════════════════════════════════════════════════════════════ */
  window.addEventListener('load', () => {
    // Warm-start the GAS container
    api({ action: 'ping' }).catch(() => {});

    // Try to restore a valid session
    try {
      const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      if (sess && Date.now() - sess.ts < SESSION_TTL) {
        currentEmail = sess.email;

        // Show cached history instantly while background sync runs
        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || 'null');
        if (Array.isArray(saved) && saved.length) {
          cachedHistory = saved;
          hideLoader();
          renderLinks(cachedHistory);
        }
        showApp();
        syncData();
        return;
      }
    } catch (_) {}

    showAuth();
  });

  /* ══════════════════════════════════════════════════════════════════════
   *  SCREEN TRANSITIONS
   * ══════════════════════════════════════════════════════════════════════ */
  function showAuth() {
    stopSync();
    $('appScreen').classList.add('hidden');
    $('unauthorizedModal').classList.add('hidden');
    $('unauthorizedModal').classList.remove('flex');
    $('authScreen').classList.remove('hidden');
  }

  function showApp() {
    $('authScreen').classList.add('hidden');
    $('unauthorizedModal').classList.add('hidden');
    $('unauthorizedModal').classList.remove('flex');
    $('appScreen').classList.remove('hidden');
    startSync();
  }

  function showDenied() {
    localStorage.removeItem(SESSION_KEY);
    currentEmail = '';
    cachedHistory = [];
    stopSync();
    $('linksContainer').innerHTML = '';
    $('appScreen').classList.add('hidden');
    $('authScreen').classList.add('hidden');
    $('unauthorizedModal').classList.remove('hidden');
    $('unauthorizedModal').classList.add('flex');
  }

  function showLoader() { $('listLoader').classList.remove('hidden'); $('listLoader').classList.add('flex'); }
  function hideLoader() { $('listLoader').classList.add('hidden');    $('listLoader').classList.remove('flex'); }

  /* ══════════════════════════════════════════════════════════════════════
   *  AUTH
   *  SECURITY: The app screen is ONLY shown AFTER the server confirms
   *  the user's email is authorised. No brief flash of content.
   * ══════════════════════════════════════════════════════════════════════ */
  async function handleCredentialResponse(response) {
    // Decode the JWT to extract email
    const b64     = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const payload = JSON.parse(decodeURIComponent(
      atob(b64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
    ));
    const email = payload.email;

    // Keep auth screen visible, show "Verifying…"
    $('authStatus').classList.remove('hidden');
    $('authStatus').textContent = 'Verifying access…';

    // Server-side auth check
    const res = await api({ action: 'history', email: email });

    if (res.success) {
      currentEmail = email;
      saveSession();
      cachedHistory = res.history || [];
      localStorage.setItem(HISTORY_KEY, JSON.stringify(cachedHistory));
      hideLoader();
      renderLinks(cachedHistory);
      stampSync();
      showApp();
    } else {
      // Not authorised — show denied screen, never reveal the app
      $('authStatus').classList.add('hidden');
      showDenied();
    }
  }

  function logout() {
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(HISTORY_KEY);
    currentEmail = '';
    cachedHistory = [];
    stopSync();
    $('linksContainer').innerHTML = '';
    showAuth();
  }

  function saveSession() {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ email: currentEmail, ts: Date.now() }));
  }

  /* ══════════════════════════════════════════════════════════════════════
   *  AUTO-SYNC
   * ══════════════════════════════════════════════════════════════════════ */
  function startSync() {
    stopSync();
    syncTimer = setInterval(() => {
      if (currentEmail && !isMutating) syncData(true);
    }, 12000);
  }

  function stopSync() {
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
  }

  async function syncData(silent = false) {
    if (!currentEmail || isMutating) return;
    const mySeq = ++syncSeq;

    if (!silent && !cachedHistory.length) showLoader();

    const res = await api({ action: 'history', email: currentEmail });
    if (mySeq !== syncSeq) return;  // stale

    hideLoader();

    if (res.success) {
      saveSession();
      cachedHistory = res.history || [];
      localStorage.setItem(HISTORY_KEY, JSON.stringify(cachedHistory));
      renderLinks(cachedHistory);
      stampSync();
    } else if ((res.message || '').includes('Unauthorized')) {
      showDenied();
    }
  }

  function stampSync() {
    $('lastSyncedLabel').textContent = '· ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  /* ══════════════════════════════════════════════════════════════════════
   *  CREATE
   * ══════════════════════════════════════════════════════════════════════ */
  async function handleSubmit() {
    const url    = $('originalUrl').value.trim();
    const title  = $('linkTitle').value.trim();
    const alias  = $('customAlias').value.trim();
    const errBox = $('errorBox');

    errBox.classList.add('hidden');
    $('submitBtn').disabled = true;
    $('btnText').textContent = 'Processing…';
    $('btnLoader').style.display = 'block';
    isMutating = true;

    try {
      const res = await api({
        action: 'create', url, title, alias,
        email: currentEmail, domain: DOMAIN
      });

      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { showDenied(); return; }
        errBox.textContent = res.message || 'Something went wrong.';
        errBox.classList.remove('hidden');
        return;
      }

      // Show result
      saveSession();
      $('shortLink').value = res.shortLink;
      $('resultTitle').textContent = res.title || 'Link Created';
      $('resultCard').classList.remove('hidden');
      $('shortenerForm').classList.add('hidden');

      // Show duplicate note if applicable
      if (res.isDuplicate) {
        $('resultDupNote').textContent = res.message || 'This URL was already shortened.';
        $('resultDupNote').classList.remove('hidden');
      } else {
        $('resultDupNote').classList.add('hidden');
        // Optimistic insert so user sees it immediately
        cachedHistory.unshift({
          title: res.title, source: url,
          shortCode: res.shortLink.replace(DOMAIN, ''),
          shortLink: res.shortLink, clicks: 0
        });
        renderLinks(cachedHistory, true);
      }
    } finally {
      isMutating = false;
      $('submitBtn').disabled = false;
      $('btnText').textContent = 'Generate a Short Url';
      $('btnLoader').style.display = 'none';
      syncData(true);
    }
  }

  function resetForm() {
    $('shortenerForm').reset();
    $('shortenerForm').classList.remove('hidden');
    $('resultCard').classList.add('hidden');
    $('resultDupNote').classList.add('hidden');
    $('errorBox').classList.add('hidden');
    $('errorBox').textContent = '';
  }

  /* ══════════════════════════════════════════════════════════════════════
   *  DELETE
   * ══════════════════════════════════════════════════════════════════════ */
  async function deleteLink(code) {
    if (!confirm('Permanently delete /' + code + '?')) return;

    // Optimistic removal
    const idx     = cachedHistory.findIndex(h => h.shortCode === code);
    const removed = idx > -1 ? cachedHistory.splice(idx, 1)[0] : null;
    renderLinks(cachedHistory);

    isMutating = true;
    try {
      const res = await api({ action: 'delete', code, email: currentEmail });
      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { showDenied(); return; }
        showToast(res.message || 'Delete failed', true);
        // Rollback
        if (removed && idx > -1) { cachedHistory.splice(idx, 0, removed); renderLinks(cachedHistory); }
      } else {
        showToast('Deleted!');
      }
    } finally {
      isMutating = false;
      syncData(true);
    }
  }

  /* ══════════════════════════════════════════════════════════════════════
   *  EDIT (modal-based, supports URL + title change)
   * ══════════════════════════════════════════════════════════════════════ */
  function openEditModal(code, currentUrl, currentTitle) {
    $('editCode').value          = code;
    $('editCodeDisplay').value   = '/' + code;
    $('editUrl').value           = currentUrl;
    $('editTitle').value         = currentTitle;
    $('editError').classList.add('hidden');
    $('editModal').classList.add('open');
  }

  function closeEditModal() {
    $('editModal').classList.remove('open');
  }

  async function submitEdit() {
    const code     = $('editCode').value;
    const newUrl   = $('editUrl').value.trim();
    const newTitle = $('editTitle').value.trim();

    if (!newUrl) {
      $('editError').textContent = 'URL cannot be empty.';
      $('editError').classList.remove('hidden');
      return;
    }

    $('editSaveBtn').disabled = true;
    $('editSaveText').textContent = 'Saving…';
    $('editSaveLoader').style.display = 'block';
    $('editError').classList.add('hidden');

    // Optimistic update
    const item    = cachedHistory.find(h => h.shortCode === code);
    const prevUrl = item ? item.source : newUrl;
    const prevTtl = item ? item.title  : '';
    if (item) {
      item.source = newUrl;
      if (newTitle) item.title = newTitle;
    }
    renderLinks(cachedHistory);

    isMutating = true;
    try {
      const params = { action: 'update', code, url: newUrl, email: currentEmail };
      if (newTitle) params.title = newTitle;
      const res = await api(params);

      if (!res.success) {
        if ((res.message || '').includes('Unauthorized')) { showDenied(); return; }
        $('editError').textContent = res.message || 'Update failed.';
        $('editError').classList.remove('hidden');
        // Rollback
        if (item) { item.source = prevUrl; item.title = prevTtl; renderLinks(cachedHistory); }
        return;
      }

      showToast('Updated!');
      closeEditModal();
    } finally {
      isMutating = false;
      $('editSaveBtn').disabled = false;
      $('editSaveText').textContent = 'Save';
      $('editSaveLoader').style.display = 'none';
      syncData(true);
    }
  }

  // Close modal on backdrop click
  $('editModal')?.addEventListener('click', e => {
    if (e.target === $('editModal')) closeEditModal();
  });

  /* ══════════════════════════════════════════════════════════════════════
   *  RENDER
   * ══════════════════════════════════════════════════════════════════════ */
  function renderLinks(data, animateFirst) {
    const c = $('linksContainer');
    c.classList.remove('hidden');

    if (!data || !data.length) {
      c.innerHTML = '<div class="text-center py-12 w-full">' +
        '<p class="text-gray-400 font-bold uppercase tracking-widest text-xs">No links yet</p></div>';
      return;
    }

    c.innerHTML = data.map((item, i) => {
      const code  = esc(item.shortCode);
      const src   = esc(item.source);
      const title = esc(item.title);
      const link  = esc(item.shortLink);
      const clicks = parseInt(item.clicks, 10) || 0;

      // Use data attributes for handlers to avoid inline JS injection issues
      return '<div class="bg-gray-50 p-5 rounded-3xl border-2 border-gray-200 flex flex-col items-center ' +
        'filter-item gap-3 shadow-sm hover:border-black transition-all text-center' +
        (animateFirst && i === 0 ? ' item-enter' : '') + '">' +
        '<div class="w-full flex flex-col items-center">' +
          '<p class="font-black text-gray-900 text-sm truncate search-target mb-1 w-full max-w-[300px]">' + title + '</p>' +
          '<p class="text-[10px] text-gray-400 truncate search-target mb-3 font-medium w-full max-w-[300px]">' + src + '</p>' +
          '<div class="flex flex-col items-center gap-2 mb-2 w-full">' +
            '<a href="' + link + '" target="_blank" rel="noopener noreferrer" ' +
              'class="text-xs font-black text-blue-600 truncate hover:underline search-target block w-full max-w-[300px]">' + link + '</a>' +
            '<span class="text-[10px] font-black text-gray-800 bg-yellow-300 border border-black px-3 py-1 rounded-lg">' +
              'Clicks: ' + clicks + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-2 justify-center w-full mt-1">' +
          '<button data-action="copy" data-link="' + link + '" ' +
            'class="bg-black text-white px-4 py-2 rounded-xl text-xs font-black uppercase ' +
            'hover:bg-yellow-400 hover:text-black transition-colors shadow-sm">Copy</button>' +
          '<button data-action="edit" data-code="' + code + '" data-url="' + src + '" data-title="' + title + '" ' +
            'class="bg-blue-100 text-blue-800 px-4 py-2 rounded-xl text-xs font-black uppercase ' +
            'hover:bg-blue-600 hover:text-white transition-colors">Edit</button>' +
          '<button data-action="del" data-code="' + code + '" ' +
            'class="bg-red-100 text-red-800 px-4 py-2 rounded-xl text-xs font-black uppercase ' +
            'hover:bg-red-600 hover:text-white transition-colors">Del</button>' +
        '</div>' +
      '</div>';
    }).join('');

    filterHistory();
  }

  // Event delegation for link action buttons (avoids inline onclick + escaping issues)
  $('linksContainer')?.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;

    const action = btn.dataset.action;
    if (action === 'copy') {
      navigator.clipboard.writeText(btn.dataset.link);
      showToast('Link Copied');
    } else if (action === 'edit') {
      openEditModal(btn.dataset.code, btn.dataset.url, btn.dataset.title);
    } else if (action === 'del') {
      deleteLink(btn.dataset.code);
    }
  });

  function filterHistory() {
    const q = $('searchInput').value.toLowerCase();
    document.querySelectorAll('.filter-item').forEach(node => {
      node.style.display = node.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
    });
  }

  /* ══════════════════════════════════════════════════════════════════════
   *  UTILITIES
   * ══════════════════════════════════════════════════════════════════════ */
  function copyLink() {
    const inp = $('shortLink');
    inp.select();
    navigator.clipboard.writeText(inp.value);
    showToast('Link Copied');
  }

  function showToast(msg, isError) {
    const t = $('toast');
    t.textContent = msg || 'Done';
    t.style.background = isError ? '#ef4444' : '#facc15';
    t.style.color      = isError ? '#fff'    : '#000';
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove('show'), 3000);
  }
  </script>
</body>
</html>
