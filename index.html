<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linker Workspace</title>
  <link rel="icon" href="https://files.catbox.moe/dkajo4.png">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    (function applyTheme() {
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        document.documentElement.classList.toggle('dark', e.matches);
      });
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; padding: 0; min-height: 100vh;
      overflow-y: auto; overflow-x: hidden;
    }
    .bg-wolf { position: fixed; inset: 0; z-index: -2; background: url('https://wallpaperaccess.com/full/8532104.jpg') center/cover no-repeat; }
    .bg-overlay { position: fixed; inset: 0; z-index: -1; background: rgba(0,0,0,.80); }
    .spinner { border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; width: 18px; height: 18px; animation: spin .7s linear infinite; display: none; }
    .spinner-dark { border: 4px solid rgba(0,0,0,.08); border-top-color: #facc15; border-radius: 50%; width: 36px; height: 36px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast {
      visibility: hidden; min-width: 200px; background: #facc15; color: #000; text-align: center;
      border-radius: 10px; padding: 12px 20px; position: fixed; z-index: 100; left: 50%; bottom: 30px;
      transform: translateX(-50%); opacity: 0; transition: opacity .25s, bottom .25s;
      font-weight: 900; text-transform: uppercase; font-size: 12px;
      box-shadow: 0 4px 20px rgba(250,204,21,.4);
    }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    .pulse-dot {
      width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
      display: inline-block; box-shadow: 0 0 0 0 rgba(34,197,94,.7);
      animation: pulse 1.6s infinite;
    }
    .pulse-dot.offline { background: #f59e0b; animation: none; box-shadow: none; }
    @keyframes pulse {
      0%  { transform: scale(.95); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34,197,94,0); }
      100%{ transform: scale(.95); }
    }
    .slim-scroll::-webkit-scrollbar { width: 5px; }
    .slim-scroll::-webkit-scrollbar-track { background: transparent; }
    .slim-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px);
    }
    .modal-backdrop.open { display: flex; }
    [data-action]:disabled { opacity: .5; cursor: wait; }
    .kbd { font-size: 9px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.08); font-family: monospace; }
    .dark .kbd { background: rgba(255,255,255,.1); }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen py-8 px-4 dark:text-white">
  <div class="bg-wolf"></div><div class="bg-overlay"></div>

  <!-- Auth Screen -->
  <div id="authScreen" class="relative z-10 w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl p-8 shadow-2xl text-center border-4 border-gray-200 dark:border-gray-700">
    <img src="https://files.catbox.moe/dkajo4.png" alt="Linker" class="w-20 h-20 rounded-full border-4 border-black dark:border-gray-600 mb-6 mx-auto object-cover shadow-lg">
    <div id="g_id_onload"
         data-client_id="1024803666625-2dsd2ebgn5h4s6pg085bmssbk4kmqdbs.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false"></div>
    <div class="g_id_signin flex justify-center w-full" data-type="standard" data-theme="outline" data-size="large"></div>
    <p id="authStatus" class="mt-5 text-xs text-gray-400 font-bold hidden">Verifying…</p>
    <p id="authError" class="mt-5 text-xs text-red-500 font-bold hidden"></p>
  </div>

  <!-- Denied Modal -->
  <div id="unauthorizedModal" class="fixed inset-0 z-50 bg-black/95 hidden flex-col items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-white dark:bg-gray-800 max-w-md w-full rounded-3xl border-4 border-red-500 p-8 text-center flex flex-col items-center">
      <h2 class="text-2xl font-black text-red-600 mb-2 uppercase tracking-widest">Access Denied</h2>
      <p class="text-gray-700 dark:text-gray-300 font-bold text-xs">Not authorized. Contact Admin.</p>
    </div>
  </div>

  <!-- Main App -->
  <div id="appScreen" class="relative z-10 w-full max-w-6xl hidden">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">

      <!-- Create Panel -->
      <div class="lg:col-span-5 flex flex-col h-full">
        <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-2xl border-4 border-gray-200 dark:border-gray-700 flex-1 flex flex-col items-center relative">
          <button id="logoutBtn" aria-label="Log out" class="absolute top-6 right-6 text-[10px] font-black uppercase text-gray-400 hover:text-red-600 transition-colors">Logout</button>
          <img src="https://files.catbox.moe/dkajo4.png" alt="Linker" class="w-16 h-16 rounded-full border-4 border-black dark:border-gray-600 mb-6 object-cover shadow-lg">

          <form id="shortenerForm" class="space-y-4 w-full" autocomplete="off">
            <input type="url" id="originalUrl" required placeholder="Enter URL" aria-label="URL to shorten"
                   class="w-full text-center border-2 border-gray-200 dark:border-gray-600 rounded-xl px-4 py-3 bg-gray-50 dark:bg-gray-700 font-bold focus:border-black dark:focus:border-yellow-400 outline-none text-xs transition-colors">
            <div class="grid grid-cols-2 gap-3 w-full">
              <input type="text" id="customAlias" placeholder="Custom Alias" aria-label="Custom alias"
                     class="w-full text-center border-2 border-gray-200 dark:border-gray-600 rounded-lg px-2 py-2 bg-gray-50 dark:bg-gray-700 focus:border-black dark:focus:border-yellow-400 outline-none text-xs transition-colors">
              <input type="text" id="linkTitle" placeholder="Title (optional)" aria-label="Link title"
                     class="w-full text-center border-2 border-gray-200 dark:border-gray-600 rounded-lg px-2 py-2 bg-gray-50 dark:bg-gray-700 focus:border-black dark:focus:border-yellow-400 outline-none text-xs transition-colors">
            </div>
            <button type="submit" id="submitBtn"
                    class="w-full bg-black dark:bg-yellow-400 hover:bg-yellow-400 dark:text-black text-white hover:text-black font-black py-3.5 rounded-xl flex justify-center items-center gap-2 uppercase text-xs transition-colors">
              <span id="btnText">Generate Short Url</span>
              <div id="btnLoader" class="spinner"></div>
            </button>
          </form>

          <div id="resultCard" class="hidden mt-4 pt-4 border-t-2 border-gray-100 dark:border-gray-700 w-full flex flex-col items-center">
            <p id="resultTitle" class="text-xs font-black text-gray-700 dark:text-gray-200 uppercase text-center w-full mb-3"></p>
            <div class="bg-yellow-50 dark:bg-gray-700 border-2 border-yellow-400 rounded-xl p-3 flex flex-col gap-2 mb-3 w-full">
              <input type="text" id="shortLink" readonly aria-label="Generated short link"
                     class="bg-transparent dark:text-white text-black font-black w-full text-center outline-none text-sm">
              <button id="shareLinkBtn"
                      class="w-full bg-black text-white dark:bg-yellow-400 dark:text-black font-bold py-2 rounded-lg hover:bg-yellow-400 hover:text-black uppercase text-xs transition-colors">Share / Copy</button>
            </div>
            <button id="resetFormBtn"
                    class="w-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-black dark:text-white font-bold py-2 rounded-xl text-xs uppercase transition-colors">Create Another</button>
          </div>
          <div id="errorBox" class="hidden mt-3 bg-red-100 dark:bg-red-900/40 text-red-900 dark:text-red-200 p-2.5 rounded-xl text-xs font-bold text-center w-full"></div>
        </div>
      </div>

      <!-- History Panel -->
      <div class="lg:col-span-7 flex flex-col h-full">
        <div class="w-full bg-white dark:bg-gray-800 rounded-3xl p-6 border-4 border-gray-200 dark:border-gray-700 shadow-2xl h-full flex flex-col items-center min-h-[500px]">
          <div class="flex items-center justify-between w-full mb-4">
            <div class="flex items-center gap-2 bg-green-50 dark:bg-green-900/50 border border-green-300 dark:border-green-700 px-3 py-1 rounded-full">
              <span class="pulse-dot" id="syncDot"></span>
              <span class="text-[10px] text-green-800 dark:text-green-200 uppercase font-black">Live</span>
            </div>
            <span id="linkCount" class="text-[10px] font-black text-gray-400 uppercase tracking-widest"></span>
          </div>
          <input type="text" id="searchInput" placeholder="Search links…" aria-label="Search links"
                 class="w-full text-center border-2 border-gray-200 dark:border-gray-600 rounded-xl px-4 py-2.5 mb-4 outline-none focus:border-black dark:focus:border-yellow-400 font-medium text-xs dark:bg-gray-700 transition-colors">

          <div id="listLoader" class="flex-col items-center justify-center flex-1 flex w-full">
            <div class="spinner-dark mb-3"></div>
          </div>

          <div class="flex-1 overflow-y-auto space-y-4 pr-1 slim-scroll w-full" style="max-height:480px" id="linksScroll">
            <div id="linksContainer" class="hidden space-y-4 w-full"></div>
            <div id="paginationControls" class="hidden w-full justify-between items-center py-4 border-t-2 border-gray-100 dark:border-gray-700 mt-4">
              <button id="prevBtn" class="bg-gray-100 dark:bg-gray-700 px-4 py-2 rounded-lg text-xs font-bold uppercase hover:bg-gray-200 dark:hover:bg-gray-600 disabled:opacity-30 transition-colors">Prev</button>
              <span id="pageInfo" class="text-[10px] font-black text-gray-400 uppercase tracking-widest"></span>
              <button id="nextBtn" class="bg-gray-100 dark:bg-gray-700 px-4 py-2 rounded-lg text-xs font-bold uppercase hover:bg-gray-200 dark:hover:bg-gray-600 disabled:opacity-30 transition-colors">Next</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Edit link">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 border-4 border-gray-200 dark:border-gray-700 w-full max-w-md mx-4">
      <h3 class="text-sm font-black uppercase text-center mb-4">Edit Link</h3>
      <input type="hidden" id="editCode">
      <div class="space-y-3">
        <input id="editCodeDisplay" readonly aria-label="Short code" class="w-full text-center border-2 border-gray-100 dark:border-gray-600 rounded-lg px-3 py-2 bg-gray-50 dark:bg-gray-700 text-gray-400 text-xs">
        <input type="url" id="editUrl" aria-label="Destination URL" class="w-full text-center border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 rounded-lg px-3 py-2 text-xs focus:border-black dark:focus:border-yellow-400 outline-none transition-colors">
        <input type="text" id="editTitle" aria-label="Link title" class="w-full text-center border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 rounded-lg px-3 py-2 text-xs focus:border-black dark:focus:border-yellow-400 outline-none transition-colors">
      </div>
      <div id="editErrorBox" class="hidden mt-3 bg-red-100 dark:bg-red-900/40 text-red-900 dark:text-red-200 p-2.5 rounded-xl text-xs font-bold text-center w-full"></div>
      <div class="flex gap-3 mt-5">
        <button id="editCancelBtn" class="flex-1 bg-gray-100 dark:bg-gray-700 py-2.5 rounded-xl text-xs font-bold uppercase hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">Cancel</button>
        <button id="editSaveBtn" class="flex-1 bg-black text-white dark:bg-yellow-400 dark:text-black py-2.5 rounded-xl text-xs font-bold uppercase flex justify-center gap-2 transition-colors">
          <span id="editSaveText">Save</span>
          <div id="editSaveLoader" class="spinner"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div id="deleteModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Confirm delete">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 border-4 border-red-300 dark:border-red-700 w-full max-w-sm mx-4 text-center">
      <h3 class="text-sm font-black uppercase mb-2 text-red-600">Delete Link</h3>
      <p id="deleteMsg" class="text-xs text-gray-600 dark:text-gray-300 font-bold mb-5"></p>
      <div class="flex gap-3">
        <button id="deleteCancelBtn" class="flex-1 bg-gray-100 dark:bg-gray-700 py-2.5 rounded-xl text-xs font-bold uppercase hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">Cancel</button>
        <button id="deleteConfirmBtn" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl text-xs font-bold uppercase flex justify-center gap-2 hover:bg-red-700 transition-colors">
          <span id="deleteConfirmText">Delete</span>
          <div id="deleteConfirmLoader" class="spinner"></div>
        </button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  'use strict';

  const SCRIPT_URL    = 'https://script.google.com/macros/s/AKfycbwEP7CIdySsPZgvccP295RY0oVoMc_9knwN8WbEfHUSq32Q7kWTv-A26hhK1Tp3zsZC/exec';
  const DOMAIN        = 'https://fkmins.github.io/url/';
  const SESSION_KEY   = 'linkerSession';
  const SESSION_TTL   = 30 * 60 * 1000; // 30 minutes
  const SYNC_INTERVAL = 60000;
  const ITEMS_PER_PAGE = 15;

  let currentEmail = '', syncTimer = null, cachedHistory = [];
  let filteredHistory = [], currentPage = 1, pendingDeleteCode = null;

  const $ = id => document.getElementById(id);

  const esc = s => {
    const div = document.createElement('div');
    div.textContent = String(s);
    return div.innerHTML;
  };

  // ── Keyboard shortcuts ──────────────────────────────────────────────────

  document.addEventListener('keydown', e => {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key.toLowerCase() === 'k') { e.preventDefault(); $('searchInput')?.focus(); }
    if (ctrl && e.key.toLowerCase() === 'n') { e.preventDefault(); $('originalUrl')?.focus(); }
    if (e.key === 'Escape') {
      if ($('editModal').classList.contains('open'))   closeEditModal();
      if ($('deleteModal').classList.contains('open')) closeDeleteModal();
    }
  });

  // ── API helpers ─────────────────────────────────────────────────────────

  async function apiGet(params) {
    const qs = new URLSearchParams({ ...params, _ts: Date.now() }).toString();
    const r = await fetch(SCRIPT_URL + '?' + qs, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function apiPost(params) {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(params),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // ── Session & auth ──────────────────────────────────────────────────────

  window.onload = () => {
    const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (sess && Date.now() - sess.ts < SESSION_TTL) {
      currentEmail = sess.email;
      showApp();
      syncData();
    } else {
      localStorage.removeItem(SESSION_KEY);
      showAuth();
    }
  };

  document.addEventListener('visibilitychange', () => {
    if (!currentEmail) return;
    if (document.visibilityState === 'visible') {
      syncData();
      syncTimer = setInterval(syncData, SYNC_INTERVAL);
    } else {
      clearInterval(syncTimer);
    }
  });

  function showAuth() {
    $('appScreen').classList.add('hidden');
    $('authScreen').classList.remove('hidden');
  }

  function showApp() {
    $('authScreen').classList.add('hidden');
    $('appScreen').classList.remove('hidden');
    clearInterval(syncTimer);
    syncTimer = setInterval(syncData, SYNC_INTERVAL);
  }

  function handleCredentialResponse(resp) {
    $('authStatus').classList.remove('hidden');
    $('authError').classList.add('hidden');
    try {
      const parts = resp.credential.split('.');
      const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
      currentEmail = payload.email;

      apiGet({ action: 'history', email: currentEmail }).then(res => {
        if (res.success) {
          localStorage.setItem(SESSION_KEY, JSON.stringify({ email: currentEmail, ts: Date.now() }));
          cachedHistory = res.history;
          processData();
          showApp();
        } else {
          $('authScreen').classList.add('hidden');
          $('unauthorizedModal').classList.remove('hidden');
          $('unauthorizedModal').classList.add('flex');
        }
      }).catch(() => {
        $('authStatus').classList.add('hidden');
        $('authError').textContent = 'Network error. Try again.';
        $('authError').classList.remove('hidden');
      });
    } catch {
      $('authStatus').classList.add('hidden');
      $('authError').textContent = 'Authentication failed.';
      $('authError').classList.remove('hidden');
    }
  }

  $('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(SESSION_KEY);
    location.reload();
  });

  // ── Sync ────────────────────────────────────────────────────────────────

  async function syncData(showSpinner) {
    if (!currentEmail) return;
    if (showSpinner === true) {
      $('linksContainer').classList.add('hidden');
      $('listLoader').classList.remove('hidden');
    }
    try {
      const res = await apiGet({ action: 'history', email: currentEmail });
      $('syncDot').classList.remove('offline');
      if (res.success) { cachedHistory = res.history; processData(); }
    } catch {
      $('syncDot').classList.add('offline');
    }
  }

  // ── Create ──────────────────────────────────────────────────────────────

  $('shortenerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const url = $('originalUrl').value.trim();
    if (!url) return;
    const title = $('linkTitle').value.trim();
    const alias = $('customAlias').value.trim();

    $('errorBox').classList.add('hidden');
    $('submitBtn').disabled = true;
    $('btnText').textContent = 'Wait…';
    $('btnLoader').style.display = 'block';

    try {
      const res = await apiPost({
        action: 'create', email: currentEmail,
        url, title, alias, domain: DOMAIN
      });
      if (res.success) {
        $('shortLink').value = res.shortLink;
        $('resultTitle').textContent = res.title;
        $('shortenerForm').classList.add('hidden');
        $('resultCard').classList.remove('hidden');
        syncData(true);
      } else {
        $('errorBox').textContent = res.message;
        $('errorBox').classList.remove('hidden');
      }
    } catch {
      $('errorBox').textContent = 'Network error.';
      $('errorBox').classList.remove('hidden');
    } finally {
      $('submitBtn').disabled = false;
      $('btnText').textContent = 'Generate Short Url';
      $('btnLoader').style.display = 'none';
    }
  });

  $('resetFormBtn').addEventListener('click', () => {
    $('shortenerForm').reset();
    $('shortenerForm').classList.remove('hidden');
    $('resultCard').classList.add('hidden');
    $('originalUrl').focus();
  });

  $('shareLinkBtn').addEventListener('click', () => handleShare($('shortLink').value));

  // ── Delete ──────────────────────────────────────────────────────────────

  function openDeleteModal(code) {
    pendingDeleteCode = code;
    $('deleteMsg').textContent = 'Permanently delete /' + code + '?';
    $('deleteModal').classList.add('open');
  }

  function closeDeleteModal() {
    $('deleteModal').classList.remove('open');
    pendingDeleteCode = null;
  }

  $('deleteCancelBtn').addEventListener('click', closeDeleteModal);

  $('deleteConfirmBtn').addEventListener('click', async () => {
    const code = pendingDeleteCode;
    if (!code) return;

    $('deleteConfirmBtn').disabled = true;
    $('deleteConfirmText').textContent = 'Deleting…';
    $('deleteConfirmLoader').style.display = 'block';

    const idx = cachedHistory.findIndex(h => h.shortCode === code);
    const backup = idx > -1 ? cachedHistory[idx] : null;
    if (idx > -1) { cachedHistory.splice(idx, 1); processData(); }

    try {
      const r = await apiPost({ action: 'delete', email: currentEmail, code });
      if (!r.success) throw new Error(r.message || 'Failed');
      closeDeleteModal();
      syncData(true);
    } catch {
      if (backup && idx > -1) { cachedHistory.splice(idx, 0, backup); processData(); }
      showToast('Delete failed');
      closeDeleteModal();
    } finally {
      $('deleteConfirmBtn').disabled = false;
      $('deleteConfirmText').textContent = 'Delete';
      $('deleteConfirmLoader').style.display = 'none';
    }
  });

  // ── Edit ────────────────────────────────────────────────────────────────

  function openEditModal(code, url, title) {
    $('editCode').value = code;
    $('editCodeDisplay').value = '/' + code;
    $('editUrl').value = url;
    $('editTitle').value = title;
    $('editErrorBox').classList.add('hidden');
    $('editModal').classList.add('open');
    $('editUrl').focus();
  }

  function closeEditModal() { $('editModal').classList.remove('open'); }
  $('editCancelBtn').addEventListener('click', closeEditModal);

  $('editSaveBtn').addEventListener('click', async () => {
    const url = $('editUrl').value.trim();
    const title = $('editTitle').value.trim();
    if (!url) {
      $('editErrorBox').textContent = 'URL is required.';
      $('editErrorBox').classList.remove('hidden');
      return;
    }

    $('editSaveBtn').disabled = true;
    $('editSaveText').textContent = 'Saving…';
    $('editSaveLoader').style.display = 'block';
    $('editErrorBox').classList.add('hidden');

    try {
      const res = await apiPost({
        action: 'update', email: currentEmail,
        code: $('editCode').value, url, title
      });
      if (res.success) {
        closeEditModal();
        syncData(true);
      } else {
        $('editErrorBox').textContent = res.message;
        $('editErrorBox').classList.remove('hidden');
      }
    } catch {
      $('editErrorBox').textContent = 'Network error.';
      $('editErrorBox').classList.remove('hidden');
    } finally {
      $('editSaveBtn').disabled = false;
      $('editSaveText').textContent = 'Save';
      $('editSaveLoader').style.display = 'none';
    }
  });

  // ── Search & render ─────────────────────────────────────────────────────

  let searchTimeout;
  $('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => { currentPage = 1; processData(); }, 250);
  });

  function processData() {
    const q = $('searchInput').value.toLowerCase().trim();
    filteredHistory = q
      ? cachedHistory.filter(h =>
          h.title.toLowerCase().includes(q) ||
          h.source.toLowerCase().includes(q) ||
          h.shortCode.toLowerCase().includes(q))
      : cachedHistory;
    renderPage();
  }

  function renderPage() {
    $('listLoader').classList.add('hidden');
    $('linksContainer').classList.remove('hidden');

    $('linkCount').textContent = cachedHistory.length + ' link' + (cachedHistory.length !== 1 ? 's' : '');

    const totalPages = Math.max(1, Math.ceil(filteredHistory.length / ITEMS_PER_PAGE));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageData = filteredHistory.slice(start, start + ITEMS_PER_PAGE);
    const maxClicks = Math.max(1, ...cachedHistory.map(h => h.clicks || 0));

    if (pageData.length) {
      $('linksContainer').innerHTML = pageData.map(h => {
        const pct = ((h.clicks || 0) / maxClicks * 100).toFixed(1);
        return `<div class="relative overflow-hidden bg-gray-50 dark:bg-gray-800 p-5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 shadow-sm text-center group">
          <div class="absolute bottom-0 left-0 h-1 bg-green-400 dark:bg-green-600 opacity-70 transition-all" style="width:${pct}%"></div>
          <p class="font-black text-sm truncate w-full max-w-[300px] mx-auto">${esc(h.title)}</p>
          <p class="text-[10px] text-gray-400 truncate mb-2 w-full max-w-[300px] mx-auto">${esc(h.source)}</p>
          <a href="${esc(h.shortLink)}" target="_blank" rel="noopener noreferrer" class="text-xs font-black text-blue-600 dark:text-blue-400 block mb-2">${esc(h.shortLink)} <span class="text-gray-500 text-[10px]">(${h.clicks || 0})</span></a>
          <div class="flex gap-2 justify-center mt-3 relative z-10">
            <button data-action="share" data-link="${esc(h.shortLink)}" class="bg-black text-white dark:bg-gray-600 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase hover:bg-yellow-400 hover:text-black transition-colors">Copy</button>
            <button data-action="edit" data-code="${esc(h.shortCode)}" data-url="${esc(h.source)}" data-title="${esc(h.title)}" class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase transition-colors">Edit</button>
            <button data-action="delete" data-code="${esc(h.shortCode)}" class="bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase transition-colors">Del</button>
          </div>
        </div>`;
      }).join('');
    } else {
      $('linksContainer').innerHTML = `<div class="py-8 flex flex-col items-center">
        <p class="text-xs font-bold text-gray-400 text-center mb-4">${cachedHistory.length ? 'No matches.' : 'No links yet.'}</p>
        <button data-action="focus-new" class="bg-black text-white dark:bg-yellow-400 dark:text-black font-bold py-2 px-4 rounded-xl text-xs uppercase hover:opacity-80 transition-opacity">Create a Link</button>
      </div>`;
    }

    if (filteredHistory.length > ITEMS_PER_PAGE) {
      $('paginationControls').classList.remove('hidden');
      $('paginationControls').classList.add('flex');
      $('pageInfo').textContent = currentPage + ' / ' + totalPages;
      $('prevBtn').disabled = currentPage <= 1;
      $('nextBtn').disabled = currentPage >= totalPages;
    } else {
      $('paginationControls').classList.add('hidden');
    }
  }

  // ── Event delegation ────────────────────────────────────────────────────

  $('linksContainer').addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'share')      handleShare(btn.dataset.link);
    if (action === 'edit')       openEditModal(btn.dataset.code, btn.dataset.url, btn.dataset.title);
    if (action === 'delete')     openDeleteModal(btn.dataset.code);
    if (action === 'focus-new')  { $('originalUrl').focus(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });

  $('prevBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); $('linksScroll').scrollTop = 0; } });
  $('nextBtn').addEventListener('click', () => { if (currentPage * ITEMS_PER_PAGE < filteredHistory.length) { currentPage++; renderPage(); $('linksScroll').scrollTop = 0; } });

  // ── Share / clipboard ───────────────────────────────────────────────────

  async function handleShare(link) {
    if (navigator.share && 'ontouchstart' in window) {
      try { await navigator.share({ title: 'Short Link', url: link }); return; } catch {}
    }
    copyToClipboard(link);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => showToast('Link copied'),
        () => fallbackCopy(text)
      );
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Link copied');
  }

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2000);
  }
  </script>
</body>
</html>
