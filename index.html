<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>URL Manager</title>
</head>
<body class="bg-gray-50 p-6 font-sans text-gray-800">

  <div class="max-w-4xl mx-auto space-y-8">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
      <h1 class="text-2xl font-bold mb-6">Create Shortlink</h1>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <input type="password" id="password" placeholder="Admin Password" class="border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="slug" placeholder="Custom Slug (e.g. resume)" class="border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        <input type="url" id="url" placeholder="Destination Long URL" class="border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button onclick="createLink()" id="createBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors w-full md:w-auto">Create Link</button>
      <p id="statusMsg" class="mt-4 text-sm font-semibold"></p>
    </div>

    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold">Analytics & Links</h2>
        <button onclick="loadStats()" class="text-blue-600 font-semibold hover:underline text-sm">Refresh Data</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 border-b">
            <tr>
              <th class="p-4">Slug</th>
              <th class="p-4">Destination</th>
              <th class="p-4">Clicks</th>
              <th class="p-4">Last Accessed</th>
            </tr>
          </thead>
          <tbody id="statsTable" class="divide-y text-gray-600">
            <tr><td colspan="4" class="p-4 text-center">Enter password and refresh to load data</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzLpxVbeA9Tk9NZW1e8Z8W8vVwamoScteknqh3JPX3Yo1I93je5K4WwsjM7fuFzxf7S/exec";

    async function createLink() {
      const password = document.getElementById('password').value;
      const slug = document.getElementById('slug').value.replace(/\s+/g, '-');
      const url = document.getElementById('url').value;
      const btn = document.getElementById('createBtn');
      const msg = document.getElementById('statusMsg');

      if(!password || !slug || !url) return alert("Fill all fields");

      btn.innerText = "Creating..."; btn.disabled = true;

      try {
        // Sending as text/plain bypasses the CORS preflight check on GAS
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "create", password, slug, url })
        });
        
        const data = await response.json();
        
        if (data.success) {
          msg.innerText = `Success! Link created: fkmins.github.io/url/${data.slug}`;
          msg.className = "mt-4 text-sm font-semibold text-green-600";
          document.getElementById('slug').value = '';
          document.getElementById('url').value = '';
          loadStats(); // Auto-refresh table
        } else {
          msg.innerText = `Error: ${data.error}`;
          msg.className = "mt-4 text-sm font-semibold text-red-600";
        }
      } catch (err) {
        msg.innerText = "Network Error";
        msg.className = "mt-4 text-sm font-semibold text-red-600";
      }
      
      btn.innerText = "Create Link"; btn.disabled = false;
    }

    async function loadStats() {
      const password = document.getElementById('password').value;
      if(!password) return alert("Please enter Admin Password first");

      const tbody = document.getElementById('statsTable');
      tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center">Loading...</td></tr>';

      try {
        const response = await fetch(`${GAS_URL}?action=stats&password=${encodeURIComponent(password)}`);
        const data = await response.json();

        if (data.success) {
          tbody.innerHTML = data.links.map(link => `
            <tr class="hover:bg-gray-50">
              <td class="p-4 font-bold text-gray-800">${link.slug}</td>
              <td class="p-4 truncate max-w-xs"><a href="${link.url}" target="_blank" class="text-blue-500 hover:underline">${link.url}</a></td>
              <td class="p-4">${link.clicks}</td>
              <td class="p-4 text-xs text-gray-500">${link.lastAccessed}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">${data.error}</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">Failed to load data.</td></tr>';
      }
    }
  </script>
</body>
</html>
