<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusLink | AI Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #000; }
    .btn-loader { border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl shadow-blue-900/5 border border-gray-100">
    <div class="mb-8 border-b-4 border-black pb-4">
      <h1 class="text-3xl font-extrabold tracking-tight flex items-center gap-2">
        <span class="text-red-600">Nexus</span>Link
      </h1>
      <p class="text-gray-500 font-semibold text-sm mt-1">Smart Enterprise Routing</p>
    </div>

    <form id="shortenerForm" onsubmit="event.preventDefault(); handleSubmit();" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-900 uppercase mb-2">Target URL <span class="text-red-600">*</span></label>
        <input type="url" id="originalUrl" required class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 bg-gray-50 text-black font-medium focus:outline-none focus:border-blue-600 focus:bg-white transition-all" placeholder="https://example.com/long-url">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-900 uppercase mb-2">Link Title <span class="text-blue-600 lowercase font-semibold">(Auto-fetches if empty)</span></label>
        <input type="text" id="linkTitle" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 bg-gray-50 text-black font-medium focus:outline-none focus:border-blue-600 focus:bg-white transition-all" placeholder="Smart Title Agent...">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-black hover:bg-red-600 text-white font-bold py-4 rounded-xl transition-all flex justify-center items-center gap-2 mt-4 shadow-lg">
        <span id="btnText">Generate Link</span>
        <div id="btnLoader" class="btn-loader"></div>
      </button>
    </form>

    <div id="resultCard" class="hidden mt-6 pt-6 border-t-2 border-gray-100">
      <div class="bg-blue-50 border-2 border-blue-100 rounded-xl p-3 flex items-center justify-between gap-3 mb-4">
        <div id="shortLink" class="text-blue-700 font-bold truncate select-all px-2 text-lg"></div>
        <button onclick="copyLink()" id="copyBtn" class="shrink-0 bg-blue-600 hover:bg-black p-3 rounded-lg text-white transition-all shadow-md">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        </button>
      </div>
      <button onclick="resetForm()" class="w-full bg-gray-100 hover:bg-gray-200 text-black font-bold py-3 rounded-xl transition-all text-sm">Create Another</button>
    </div>
    
    <div id="errorBox" class="hidden mt-4 bg-red-100 text-red-900 p-3 rounded-lg text-sm font-bold text-center border-2 border-red-200"></div>
  </div>

  <script>
    // --- YOUR WEB APP URL ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLpxVbeA9Tk9NZW1e8Z8W8vVwamoScteknqh3JPX3Yo1I93je5K4WwsjM7fuFzxf7S/exec'; 

    async function handleSubmit() {
      const title = document.getElementById('linkTitle').value;
      const url = document.getElementById('originalUrl').value;
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const resultCard = document.getElementById('resultCard');

      errorBox.classList.add('hidden'); resultCard.classList.add('hidden');
      btn.disabled = true; document.getElementById('btnText').innerText = 'Processing...';
      document.getElementById('btnLoader').style.display = 'block';

      // NATIVE FORM DATA BYPASS (Prevents CORS Crash)
      const formData = new URLSearchParams();
      formData.append("originalUrl", url);
      formData.append("title", title);
      formData.append("domain", "https://fkmins.github.io/url/");

      try {
        const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
        
        // Read as raw text first to avoid JSON parse crashes
        const rawText = await response.text();
        const res = JSON.parse(rawText);
        
        btn.disabled = false; document.getElementById('btnText').innerText = 'Generate Link';
        document.getElementById('btnLoader').style.display = 'none';
        
        if (!res.success) {
           errorBox.innerText = res.message; errorBox.classList.remove('hidden');
        } else {
           document.getElementById('shortLink').innerText = res.shortLink;
           resultCard.classList.remove('hidden');
           document.getElementById('shortenerForm').classList.add('hidden');
        }
      } catch (err) {
        btn.disabled = false; document.getElementById('btnText').innerText = 'Generate Link';
        document.getElementById('btnLoader').style.display = 'none';
        errorBox.innerText = 'Error saving link. Check deployment permissions.'; 
        errorBox.classList.remove('hidden');
      }
    }

    function copyLink() {
      navigator.clipboard.writeText(document.getElementById('shortLink').innerText).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
        btn.classList.replace('bg-blue-600', 'bg-red-600');
        setTimeout(() => {
          btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>';
          btn.classList.replace('bg-red-600', 'bg-blue-600');
        }, 1500);
      });
    }

    function resetForm() {
      document.getElementById('shortenerForm').reset();
      document.getElementById('shortenerForm').classList.remove('hidden');
      document.getElementById('resultCard').classList.add('hidden');
    }
  </script>
</body>
</html>
